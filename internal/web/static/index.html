<!DOCTYPE html>
<!--
  文件：internal/web/static/index.html（go:embed，Web 入口的可视化页面）
  模块：Serendipity Engine 图谱漫游 UI（纯前端，零依赖原生 JS）

  ▍设计语言（v0.1.6 换肤）
    采用 dsh web 同款 design language（Tokyo Night 风格暗色）：
      背景 #181926 · 面板 #1e2030 · 浮起面板 #24273a · 交互按钮 #363a4f
      正文 #cad3f5 · 弱化 #6e738d · 强调蓝 #7aa2f7 · 边界 rgba(255,255,255,.06/.12)
    保留原有 1/2/3-hop 配色（金/蓝/紫），整体更克制、贴近 dsh web。

  ▍功能
    - 初始页：热门节点漂浮气泡（/api/hot），点击气泡开始漫游
    - 搜索框：查询漫游（/api/roam），锚点按 match 级别/度展示前 5 个
    - 🎲 随机漫步（/api/roam?random=1，v0.1.7）：随机 roll 起点 + 它的簇——
      "节点 + 簇"一次给出；点簇内任意卡片即转入正常漫游
    - 设置抽屉 ⚙：暴露安全可调参数（/api/config 白名单：top/hops/lambda/theta/
      alpha/beta/rand_alpha），范围/步长/默认来自服务端，localStorage 记忆，可一键重置
    - 关系查询（/api/relation，v0.1.5）：两节点最短路径 + 双向 PPR + 证据链
    - 卡片：点击任意卡片 = 从该节点继续漫游（探索路径，push 历史栈）
    - 历史栈与浏览器 history 同步：后退/前进键可用（?q= URL 同步）
    - 打开跳转：卡片「打开 ↗」→ obsidian:// 或 orca-note://（server 端拼 URI）
    - 反馈埋点：点击上报 /api/touch（独立表，仅记录不演化）
    - 自动监听提示：轮询 /api/stats 对比 revision
    - 深跳节点（score≤0）：不显示无意义的 0 分，改用「深跳」标签（serendipity 机制保留）

  ▍修改记录
    v0.1.0  初版：漫游/锚点/卡片/历史栈/回退/初始页气泡
    v0.1.1  页面与画像改动无涉本文件
    v0.1.2  刷新按钮 + diff 摘要展示
    v0.1.3  锚点可点击；点击显示标题；孤立节点"到头了"提示；事件委托；onerror 可见
    v0.1.4  反馈埋点 /api/touch；轮询 stats 提示"库已自动更新"
    v0.1.5  关系查询 URI（后端）；本文件未涉
    v0.1.6  dsh web 设计语言换肤；设置抽屉暴露安全参数（/api/config + clamp）；
            深跳节点 score≤0 展示修复；接入 /api/relation 关系查询；交互与可用性优化
    v0.1.7  🎲 随机漫步按钮（/api/roam?random=1）；随机起点标签 + 空簇提示；
            设置抽屉新增"随机漫步·度加权"滑块（rand_alpha）
    v0.1.8  安全前置：服务端注入 API token（__SEREN_TOKEN__），fetch 包装自动携带
            X-Seren-Token 头——外部页面读不到 token，无法 CSRF 调用
    v0.1.11 卡片「预览」（/api/node 详情浮层）与「相似」（/api/similar 折叠面板，
            共享邻居证据）；顶栏「导出」（/api/roam?export=1 → Markdown 下载）与
            「统计」（/api/touch/stats 折叠面板，只读展示）；刷新摘要补「改名 N」
-->
<html lang="zh">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Serendipity Engine · 图谱漫游</title>
<style>
  :root {
    /* dsh web 同款设计语言（Tokyo Night） */
    --bg: #181926; --panel: #1e2030; --surface: #24273a; --elevated: #363a4f;
    --text: #cad3f5; --muted: #6e738d; --border: rgba(255,255,255,.06);
    --border-strong: rgba(255,255,255,.12); --accent: #7aa2f7; --accent-2: #6384ff;
    --primary: #677fb5; --primary-hover: #7a90cc;
    --hop1: #e0af68; --hop2: #7aa2f7; --hop3: #bb9af7;
    --danger: #ed8796; --warn: #e0af68; --ok: #9ece6a;
    --radius: 12px; --radius-sm: 8px; --radius-pill: 999px;
    --shadow: 0 6px 20px rgba(0,0,0,.35);
    --font: -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC",
            "Hiragino Sans GB", "Microsoft YaHei", "Helvetica Neue", Arial, sans-serif;
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; }
  body { background: var(--bg); color: var(--text); font-family: var(--font);
         font-size: 15px; line-height: 1.5; -webkit-font-smoothing: antialiased; }
  button { font-family: var(--font); }
  a { color: var(--accent); text-decoration: none; }

  /* ---- 顶栏 ---- */
  header { position: sticky; top: 0; z-index: 10; padding: 12px 20px;
    border-bottom: 1px solid var(--border); background: color-mix(in srgb, var(--bg) 88%, #000);
    display: flex; align-items: center; gap: 12px; backdrop-filter: blur(6px); }
  .header-left, .header-right { display: flex; align-items: center; gap: 6px; }
  .header-right { margin-left: auto; }
  .brand { font-size: 16px; font-weight: 700; color: var(--text); margin: 0;
    cursor: pointer; letter-spacing: .2px; display: flex; align-items: center; gap: 8px; }
  .brand:hover { color: var(--accent); }
  .brand .tag { font-size: 11px; font-weight: 500; color: var(--muted);
    border: 1px solid var(--border-strong); border-radius: var(--radius-pill);
    padding: 1px 8px; }

  .icon-btn { width: 34px; height: 34px; display: inline-flex; align-items: center;
    justify-content: center; background: var(--surface); border: 1px solid var(--border);
    color: var(--text); border-radius: var(--radius-sm); cursor: pointer; font-size: 15px; }
  .icon-btn:hover:not(:disabled) { border-color: var(--accent); color: var(--accent); }
  .icon-btn:disabled { opacity: .35; cursor: default; }

  .btn { display: inline-flex; align-items: center; justify-content: center; gap: 6px;
    padding: 8px 16px; border-radius: var(--radius-pill); font-size: 14px; font-weight: 600;
    cursor: pointer; border: 1px solid var(--border-strong); background: var(--surface);
    color: var(--text); transition: background .15s, border-color .15s, transform .05s; }
  .btn:hover { border-color: var(--accent); }
  .btn:disabled { opacity: .45; cursor: default; }
  .btn.primary { background: var(--primary); color: #0e0f17; border-color: transparent; }
  .btn.primary:hover { background: var(--primary-hover); }
  .btn.ghost { background: transparent; }
  .btn.sm { padding: 4px 12px; font-size: 12.5px; font-weight: 500; }

  main { max-width: 920px; margin: 0 auto; padding: 20px 20px 48px; }

  /* ---- 搜索 ---- */
  .search { display: flex; gap: 10px; margin-bottom: 10px; }
  .search input { flex: 1; background: var(--surface); border: 1px solid var(--border-strong);
    color: var(--text); padding: 12px 16px; border-radius: var(--radius); font-size: 15px;
    outline: none; }
  .search input::placeholder { color: var(--muted); }
  .search input:focus { border-color: var(--accent); }
  .search .btn { padding: 12px 22px; }

  .source-line { color: var(--muted); font-size: 12.5px; margin: 2px 0 8px;
    display: flex; align-items: center; gap: 6px; flex-wrap: wrap; }
  .source-line .tag { color: var(--muted); border: 1px solid var(--border);
    border-radius: var(--radius-sm); padding: 1px 6px; font-size: 11.5px; }

  /* ---- 折叠面板（关系查询 / 参数设置） ---- */
  .panel { background: var(--panel); border: 1px solid var(--border);
    border-radius: var(--radius); padding: 14px 16px; margin-bottom: 14px;
    animation: fade .12s ease; }
  .panel.hidden { display: none; }
  @keyframes fade { from { opacity: 0; transform: translateY(-4px); } to { opacity: 1; transform: none; } }

  /* 关系查询 */
  .rel-inputs { display: flex; gap: 8px; align-items: center; flex-wrap: wrap; }
  .rel-inputs input { flex: 1; min-width: 160px; background: var(--surface);
    border: 1px solid var(--border-strong); color: var(--text); padding: 10px 12px;
    border-radius: var(--radius-sm); font-size: 14px; outline: none; }
  .rel-inputs input:focus { border-color: var(--accent); }
  .rel-x { color: var(--muted); font-size: 16px; }
  .rel-result { margin-top: 12px; font-size: 13.5px; color: var(--text); }
  .rel-result .rel-path { display: flex; flex-wrap: wrap; gap: 6px; align-items: center; }
  .rel-node { background: var(--surface); border: 1px solid var(--border-strong);
    border-radius: var(--radius-sm); padding: 4px 10px; font-size: 13px; cursor: pointer; }
  .rel-node:hover { border-color: var(--accent); color: var(--accent); }
  .rel-arrow { color: var(--muted); }
  .rel-stats { margin-top: 10px; color: var(--muted); font-size: 12.5px; }
  .rel-empty { color: var(--muted); }

  /* 设置抽屉 */
  .cfg-head { display: flex; align-items: center; justify-content: space-between;
    margin-bottom: 12px; font-weight: 600; font-size: 14px; color: var(--text); }
  .cfg-group-label { color: var(--muted); font-size: 12px; text-transform: uppercase;
    letter-spacing: .5px; margin: 12px 0 6px; }
  .cfg-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(240px, 1fr));
    gap: 12px 20px; }
  .cfg-field { display: flex; flex-direction: column; gap: 4px; }
  .cfg-field .row { display: flex; align-items: center; justify-content: space-between; }
  .cfg-field .lbl { font-size: 13.5px; color: var(--text); }
  .cfg-field .val { font-size: 13px; color: var(--accent); font-variant-numeric: tabular-nums; }
  .cfg-field .hint { font-size: 11.5px; color: var(--muted); }
  .cfg-field input[type=range] { width: 100%; accent-color: var(--accent); cursor: pointer; }

  /* ---- 元信息 ---- */
  .meta { color: var(--muted); font-size: 13px; margin: 6px 0 12px; min-height: 18px; }
  .anchors { display: flex; gap: 6px; flex-wrap: wrap; margin-bottom: 14px; }
  .anchor { background: var(--surface); border: 1px solid var(--border-strong);
    border-radius: var(--radius-sm); padding: 5px 11px; font-size: 12.5px; color: var(--muted);
    cursor: pointer; }
  .anchor:hover { border-color: var(--accent); color: var(--accent); }
  .anchor.more { cursor: default; color: var(--muted); }
  .anchor.more:hover { border-color: var(--border-strong); color: var(--muted); }

  /* ---- 卡片 ---- */
  .card { background: var(--panel); border: 1px solid var(--border); border-radius: var(--radius);
    padding: 13px 16px; margin-bottom: 8px; cursor: pointer;
    transition: border-color .15s, transform .08s, background .15s; }
  .card:hover { border-color: var(--accent); transform: translateX(3px); }
  .card .top { display: flex; align-items: center; gap: 10px; flex-wrap: wrap; }
  .card .rank { color: var(--accent); font-weight: 700; min-width: 24px; font-size: 14px; }
  .card .title { font-size: 15px; font-weight: 600; }
  .card .id { color: var(--muted); font-size: 12px; }
  .card .type { font-size: 11px; border: 1px solid var(--border-strong); border-radius: var(--radius-sm);
    padding: 1px 8px; color: var(--muted); }
  .card .hop { font-size: 11px; border-radius: var(--radius-sm); padding: 1px 8px; font-weight: 700; }
  .hop-1 { color: var(--hop1); border: 1px solid color-mix(in srgb, var(--hop1) 45%, transparent); }
  .hop-2 { color: var(--hop2); border: 1px solid color-mix(in srgb, var(--hop2) 45%, transparent); }
  .hop-3 { color: var(--hop3); border: 1px solid color-mix(in srgb, var(--hop3) 45%, transparent); }
  .hop.deep { color: var(--muted); border-color: var(--border-strong); }
  .card .open { margin-left: auto; font-size: 12.5px; color: var(--accent);
    border: 1px solid var(--border-strong); border-radius: var(--radius-sm); padding: 2px 9px; }
  .card .open:hover { border-color: var(--accent); background: color-mix(in srgb, var(--accent) 12%, transparent); }
  .card .meta-line { color: var(--muted); font-size: 12px; margin-top: 6px; line-height: 1.6; }
  .card .path { color: var(--muted); font-size: 12px; margin-top: 5px; word-break: break-all; }
  .card .scores { color: var(--muted); font-size: 11.5px; margin-top: 3px; }

  /* ---- 初始页 hero / 气泡 ---- */
  .hero { position: relative; height: 56vh; min-height: 400px; margin-top: 14px;
    border: 1px solid var(--border); border-radius: var(--radius); overflow: hidden;
    background: radial-gradient(ellipse at 30% 20%, var(--panel) 0%, var(--bg) 72%); }
  .hero-title { text-align: center; padding-top: 40px; font-size: 30px; font-weight: 800;
    color: var(--text); letter-spacing: .5px; }
  .hero-title .accent { color: var(--accent); }
  .hero-sub { text-align: center; color: var(--muted); font-size: 13.5px; margin-top: 8px; }
  .bubbles { position: absolute; inset: 0; }
  .bubble { position: absolute; border-radius: var(--radius-pill); display: flex;
    align-items: center; justify-content: center; cursor: pointer;
    border: 1px solid var(--border-strong); background: var(--panel); color: var(--text);
    font-size: 12.5px; text-align: center; padding: 6px 14px; font-weight: 500;
    max-width: 160px; box-shadow: var(--shadow); overflow: hidden; text-overflow: ellipsis;
    animation: floaty var(--dur) ease-in-out infinite alternate; user-select: none; white-space: nowrap; }
  .bubble:hover { border-color: var(--accent); color: var(--accent); z-index: 2; }
  @keyframes floaty {
    from { transform: translate(0, 0); }
    to { transform: translate(var(--dx), var(--dy)); }
  }
  .type-人物 { border-color: color-mix(in srgb, var(--hop1) 55%, transparent); color: var(--hop1); }
  .type-设定 { border-color: color-mix(in srgb, var(--hop2) 55%, transparent); color: var(--hop2); }
  .type-线索 { border-color: color-mix(in srgb, var(--hop3) 55%, transparent); color: var(--hop3); }
  .type-ADR  { border-color: color-mix(in srgb, var(--ok) 55%, transparent); color: var(--ok); }
  .type-doc  { border-color: color-mix(in srgb, var(--hop2) 55%, transparent); color: var(--hop2); }
  .type-block{ border-color: color-mix(in srgb, var(--muted) 45%, transparent); color: var(--muted); }

  .fallback { background: color-mix(in srgb, var(--warn) 12%, var(--panel));
    border: 1px solid color-mix(in srgb, var(--warn) 40%, transparent); border-radius: var(--radius-sm);
    padding: 10px 14px; color: var(--warn); font-size: 13px; margin-bottom: 12px; }
  .empty { color: var(--muted); text-align: center; padding: 48px 0; font-size: 14px; }
  .deadend { background: color-mix(in srgb, var(--warn) 16%, var(--panel));
    border: 2px solid var(--warn); color: var(--warn);
    border-radius: var(--radius); padding: 26px 18px; text-align: center; font-size: 17px;
    font-weight: 700; margin-bottom: 12px; }
  .deadend-sub { font-size: 13px; font-weight: 400; color: var(--muted); margin-top: 8px; }
  .hint { color: var(--muted); font-size: 12px; margin-top: 24px; text-align: center; }

  /* 加载态 */
  .loading { color: var(--muted); text-align: center; padding: 24px 0; font-size: 13px; }

  /* 卡片动作按钮（预览 / 相似，v0.1.11） */
  .card .actions { display: flex; gap: 6px; margin-top: 8px; }
  .card .act { font-size: 12px; color: var(--muted); border: 1px solid var(--border-strong);
    border-radius: var(--radius-sm); padding: 2px 9px; cursor: pointer; background: transparent; }
  .card .act:hover { border-color: var(--accent); color: var(--accent); }

  /* 节点详情预览浮层（v0.1.11，前端 #3） */
  .detail-overlay { position: fixed; inset: 0; background: rgba(0,0,0,.5); z-index: 20;
    display: flex; align-items: center; justify-content: center; padding: 20px;
    animation: fade .12s ease; }
  .detail-card { width: min(560px, 100%); max-height: 80vh; overflow: auto;
    background: var(--panel); border: 1px solid var(--border-strong); border-radius: var(--radius);
    padding: 18px 20px; box-shadow: var(--shadow); }
  .detail-card .dhead { display: flex; align-items: center; gap: 10px; margin-bottom: 10px; }
  .detail-card .dtitle { font-size: 17px; font-weight: 700; }
  .detail-card .dtype { font-size: 11px; border: 1px solid var(--border-strong);
    border-radius: var(--radius-sm); padding: 1px 8px; color: var(--muted); }
  .detail-card .dclose { margin-left: auto; cursor: pointer; color: var(--muted); font-size: 18px; }
  .detail-card .dclose:hover { color: var(--accent); }
  .detail-card .dmeta { color: var(--muted); font-size: 12.5px; margin-bottom: 10px; word-break: break-all; }
  .detail-card .dtext { font-size: 13px; color: var(--text); line-height: 1.6; margin-bottom: 12px;
    white-space: pre-wrap; max-height: 220px; overflow: auto; background: var(--surface);
    border: 1px solid var(--border); border-radius: var(--radius-sm); padding: 10px 12px; }
  .detail-card .dsec { font-size: 12px; color: var(--muted); text-transform: uppercase;
    letter-spacing: .5px; margin: 10px 0 6px; }
  .detail-card .dneighbors { display: flex; flex-wrap: wrap; gap: 6px; }
  .detail-card .dnod { background: var(--surface); border: 1px solid var(--border-strong);
    border-radius: var(--radius-sm); padding: 4px 10px; font-size: 13px; cursor: pointer; }
  .detail-card .dnod:hover { border-color: var(--accent); color: var(--accent); }
  .detail-card .dempty { color: var(--muted); font-size: 12.5px; }

  /* 相似面板（复用折叠 panel，v0.1.11） */
  #sim-result .sim-item { display: flex; align-items: center; justify-content: space-between;
    padding: 6px 8px; border-radius: var(--radius-sm); cursor: pointer; font-size: 13.5px; }
  #sim-result .sim-item:hover { background: var(--surface); }
  #sim-result .sim-item .evi { color: var(--muted); font-size: 11.5px; }

  /* 统计面板（v0.1.11） */
  #stat-result { font-size: 13px; }
  #stat-result .stat-line { color: var(--muted); margin: 6px 0; }
  #stat-result .stat-tag { display: inline-block; background: var(--surface);
    border: 1px solid var(--border-strong); border-radius: var(--radius-sm);
    padding: 2px 8px; font-size: 12px; margin: 2px 3px 2px 0; }
  @media (max-width: 560px) {
    .brand .tag { display: none; }
    .header-right .btn .txt { display: none; }
    .rel-inputs { flex-direction: column; align-items: stretch; }
    .rel-x { text-align: center; }
  }
</style>
</head>
<body>
<header>
  <div class="header-left">
    <button id="home" class="icon-btn" title="回到初始页">⌂</button>
    <button id="back" class="icon-btn" disabled title="上一步">←</button>
    <button id="refresh" class="icon-btn" title="对账刷新：重新解析并同步增删改">↻</button>
    <button id="dice" class="icon-btn" title="随机漫步：随机起点 + 它的簇">🎲</button>
  </div>
  <h1 id="brand" class="brand">Serendipity Engine <span class="tag" id="ver"></span></h1>
  <div class="header-right">
    <button id="export" class="btn ghost sm" title="导出当前漫游为 Markdown"><span class="txt">导出</span></button>
    <button id="stat-toggle" class="btn ghost sm" title="反馈埋点统计（只读）"><span class="txt">统计</span></button>
    <button id="rel-toggle" class="btn ghost sm" title="两节点关系查询"><span class="txt">关系</span></button>
    <button id="cfg-toggle" class="btn ghost sm" title="调整漫游参数">⚙ <span class="txt">参数</span></button>
  </div>
</header>
<main>
  <div class="search">
    <input id="q" placeholder="输入笔记名 / 标签 / 任意词…" autocomplete="off" autofocus>
    <button id="go" class="btn primary">漫游</button>
  </div>
  <div id="source" class="source-line"></div>

  <!-- 关系查询（可折叠） -->
  <div id="rel-panel" class="panel hidden">
    <div class="rel-inputs">
      <input id="rel-from" placeholder="节点 A（名称/ID）">
      <span class="rel-x">↔</span>
      <input id="rel-to" placeholder="节点 B（名称/ID）">
      <button id="rel-go" class="btn primary">查关系</button>
    </div>
    <div id="rel-result" class="rel-result"></div>
  </div>

  <!-- 相似面板（可折叠，v0.1.11 结构相似 Jaccard） -->
  <div id="sim-panel" class="panel hidden">
    <div class="cfg-head">
      <span>相似节点 <small style="color:var(--muted);font-weight:400">共同邻居多但互不链接</small></span>
      <button id="sim-close" class="btn ghost sm">关闭</button>
    </div>
    <div id="sim-result" class="rel-result"></div>
  </div>

  <!-- 统计面板（可折叠，v0.1.11 埋点只读） -->
  <div id="stat-panel" class="panel hidden">
    <div class="cfg-head">
      <span>反馈统计 <small style="color:var(--muted);font-weight:400">只读，不参与排序</small></span>
      <button id="stat-close" class="btn ghost sm">关闭</button>
    </div>
    <div id="stat-result"></div>
  </div>

  <!-- 参数设置抽屉（可折叠） -->
  <div id="cfg-panel" class="panel hidden">
    <div class="cfg-head">
      <span>漫游参数</span>
      <button id="cfg-reset" class="btn ghost sm">重置默认</button>
    </div>
    <div id="cfg-fields"></div>
  </div>

  <div id="meta" class="meta"></div>
  <div id="anchors" class="anchors"></div>
  <div id="fallback"></div>
  <div id="list"></div>
  <div class="hint">🎲 随机漫步：随机起点 + 它的簇 · 点击任意卡片 → 从该节点继续漫游（探索路径）· 点击「⚙ 参数」可调整漫游设置</div>
</main>
<script>
const $ = s => document.querySelector(s);
const $$ = s => Array.from(document.querySelectorAll(s));

// ---- API 鉴权（v0.1.8 安全前置）：服务端注入 token，包装 fetch 自动携带 ----
// 占位符 __SEREN_TOKEN__ 由 server.handleIndex 替换为真实 token；外部页面
// 受同源策略限制读不到 → 拿不到 token → 无法调用 /api/*（防 CSRF）。
const __API_TOKEN__ = '__SEREN_TOKEN__';
const __origFetch = window.fetch;
window.fetch = (url, opts) => {
  opts = opts || {};
  opts.headers = Object.assign({ 'X-Seren-Token': __API_TOKEN__ }, opts.headers || {});
  return __origFetch(url, opts);
};

// ---- 可调参数状态（默认来自 /api/config，localStorage 记忆）----
let params = {};        // {key: value}
let paramDefs = [];     // /api/config 返回的白名单定义
const PARAMS_KEY = 'seren.params';

function loadSavedParams() {
  try { return JSON.parse(localStorage.getItem(PARAMS_KEY) || '{}'); }
  catch (e) { return {}; }
}
function saveParams() {
  try { localStorage.setItem(PARAMS_KEY, JSON.stringify(params)); } catch (e) {}
}
// 把当前参数拼成 /api/roam 的 query 后缀
function paramQS() {
  return Object.keys(params).map(k => k + '=' + encodeURIComponent(params[k])).join('&');
}

// 从配置文件填充 params（localStorage 覆盖默认值；只认识白名单内的 key）
function initParams(cfg) {
  paramDefs = cfg.params || [];
  const saved = loadSavedParams();
  params = {};
  for (const d of paramDefs) {
    params[d.key] = (saved[d.key] !== undefined) ? +saved[d.key] : +d.default;
  }
  renderCfg();
}

// 渲染设置抽屉的滑块/输入
function renderCfg() {
  const box = $('#cfg-fields');
  if (!box) return;
  const groups = {};
  for (const d of paramDefs) {
    (groups[d.group || '其他'] = groups[d.group || '其他'] || []).push(d);
  }
  let html = '';
  for (const g of Object.keys(groups)) {
    html += '<div class="cfg-group-label">' + esc(g) + '</div><div class="cfg-grid">';
    for (const d of groups[g]) {
      const v = params[d.key];
      const val = d.type === 'int' ? Math.round(v) : (+v).toFixed(d.step < 0.05 ? 2 : 1);
      html += '<div class="cfg-field">' +
        '<div class="row"><span class="lbl">' + esc(d.label) + '</span>' +
        '<span class="val" id="cfg-val-' + esc(d.key) + '">' + val + '</span></div>' +
        '<input type="range" min="' + d.min + '" max="' + d.max + '" step="' + d.step +
        '" value="' + v + '" data-key="' + esc(d.key) + '">' +
        '<span class="hint">' + esc(d.hint || '') + '</span></div>';
    }
    html += '</div>';
  }
  box.innerHTML = html;
  $$('#cfg-fields input[type=range]').forEach(inp => {
    inp.addEventListener('input', () => {
      const d = defFor(inp.dataset.key);
      const v = d.type === 'int' ? Math.round(+inp.value) : +inp.value;
      params[inp.dataset.key] = v;
      const el = $('#cfg-val-' + inp.dataset.key);
      if (el) el.textContent = d.type === 'int' ? v : (+v).toFixed(d.step < 0.05 ? 2 : 1);
      saveParams();
      reRoamDebounced();   // 松手后再真正重查（防拖动刷爆 API）
    });
  });
}
function defFor(key) { return paramDefs.find(d => d.key === key); }

// 重置参数为默认并重查
function resetParams() {
  for (const d of paramDefs) params[d.key] = +d.default;
  saveParams();
  renderCfg();
  reRoam();
}

let reRoamTimer = null;
function reRoamDebounced() {
  clearTimeout(reRoamTimer);
  reRoamTimer = setTimeout(reRoam, 350);
}
// 重新执行当前查询（应用新参数）；空查询则回初始页
function reRoam() {
  const q = $('#q').value.trim();
  if (q) roam(q, 'replace'); else renderHome();
}

// ---- 显示版本 & 源信息（/api/config + /api/stats）----
fetch('/api/config').then(r => r.json()).then(cfg => {
  initParams(cfg);
  if (cfg.version && $('#ver')) $('#ver').textContent = cfg.version;
  if (cfg.source) $('#source').innerHTML = '<span class="tag">源</span> ' + esc(cfg.source) +
    '<span class="tag">节点 ' + cfg.nodes + '</span><span class="tag">边 ' + cfg.edges + '</span>';
}).catch(() => {
  // 降级：即便 config 失败也不阻塞，用默认值
  fetch('/api/stats').then(r => r.json()).then(s => {
    if (s.version && $('#ver')) $('#ver').textContent = s.version;
  }).catch(() => {});
});

// ---- 漫游历史栈（与浏览器 history 同步）----
let stack = [];
let pos = -1;

async function roam(query, mode, display) {
  let d;
  try {
    const qs = paramQS();
    const url = '/api/roam?q=' + encodeURIComponent(query) + (qs ? '&' + qs : '');
    const r = await fetch(url);
    d = await r.json();
  } catch (e) {
    $('#meta').textContent = '请求失败: ' + e.message;
    return;
  }
  $('#q').value = display || query;
  if (display && mode === 'push') {
    $('#meta').textContent = '从「' + display + '」继续漫游';
  }

  if (mode === 'push') {
    stack = stack.slice(0, pos + 1);
    stack.push(query);
    pos++;
    history.pushState({ q: query }, '', '?q=' + encodeURIComponent(query));
  } else if (mode === 'replace') {
    history.replaceState({ q: query }, '', '?q=' + encodeURIComponent(query));
  }
  $('#back').disabled = pos <= 0;
  renderOutcome(d, query, false);
}

// 🎲 随机漫步（v0.1.7）：服务端 roll 随机起点 + 它的簇。
// 不进历史栈——"随便逛逛"不该打断/污染回退路径；点簇内任意卡片即转入正常漫游。
async function roamRandom() {
  let d;
  try {
    const qs = paramQS();
    const url = '/api/roam?random=1' + (qs ? '&' + qs : '');
    const r = await fetch(url);
    d = await r.json();
  } catch (e) {
    $('#meta').textContent = '请求失败: ' + e.message;
    return;
  }
  const anchor = (d.anchors || [])[0];
  $('#q').value = anchor && anchor.title ? anchor.title : '';
  $('#meta').textContent = '🎲 随机起点（再点 🎲 换一个；点卡片从该节点继续漫游）';
  renderOutcome(d, '', true);
}

// 渲染 roam 响应（锚点/降级/列表）。listMode=true 时空查询也渲染列表（随机漫步）。
function renderOutcome(d, query, listMode) {
  // ---- 锚点：按 match 级别降序、同级别按度降序，只显示前 5 个"重的" ----
  const anchors = (d.anchors || []).slice().sort((a, b) => (b.match - a.match) || (b.deg - a.deg));
  const shownA = anchors.slice(0, 5);
  $('#anchors').innerHTML = '';
  if (shownA.length) {
    $('#anchors').innerHTML = shownA.map(a =>
      `<span class="anchor" data-id="${esc(a.id)}" data-title="${esc(a.title)}"
         title="点击从该节点继续漫游">${a.random ? '🎲 随机起点' : '锚'}: ${esc(a.title)} (${esc(a.type)})</span>`).join('');
    if (anchors.length > shownA.length) {
      const more = document.createElement('span');
      more.className = 'anchor more';
      more.textContent = '… 共 ' + anchors.length + ' 个锚点';
      $('#anchors').appendChild(more);
    }
  }

  $('#fallback').innerHTML = '';
  if (d.fallback === 1) {
    $('#fallback').innerHTML = '<div class="fallback">锚定失败 → 全文检索降级（搜索式）</div>';
  } else if (d.fallback === 2) {
    $('#fallback').innerHTML = '<div class="fallback">查询点无/少链接 → 全文检索降级</div>';
  }

  const list = $('#list');
  if (!query && !listMode) { renderHome(); return; }

  const cards = (d.results || []).concat((d.fallback_hits || []).map(h => ({
    id: h.id, title: h.title, type: h.type, hops: 0,
    path: h.id, note: '全文命中 ' + h.count + ' 次'
  })));
  if (!cards.length) {
    const isRandom = !!(d.anchors || [])[0] && d.anchors[0].random;
    if (d.fallback === 2) {
      list.innerHTML = `<div class="deadend">⚠ 这个节点到头了
        <div class="deadend-sub">它没有关联的节点——试试搜索其他关键词，或点左上角「⌂」回初始页</div></div>`;
    } else if (isRandom) {
      list.innerHTML = '<div class="empty">🎲 这个节点比较安静，没有关联簇——再掷一次试试</div>';
    } else {
      list.innerHTML = '<div class="empty">无命中——库里没有相关内容</div>';
    }
    return;
  }
  list.innerHTML = cards.map((c, i) => cardHTML(c, i)).join('');
}

// 深跳节点分数展示：score≤0 时 min-max 归一化后分数无区分度，
// 显示 "score=0.000" 难看且误导 → 改用「深跳」标签（serendipity 机制本身保留）。
function scoreLine(c) {
  if (c.note) return c.note; // 全文降级命中
  const parts = [];
  if (c.score !== undefined && c.score > 0) parts.push('score ' + (+c.score).toFixed(3));
  if (c.ppr !== undefined && c.ppr > 0) parts.push('ppr ' + (+c.ppr).toFixed(4));
  if (c.act !== undefined && c.act > 0) parts.push('act ' + (+c.act).toFixed(3));
  return parts.join(' · ') || '深跳';
}

function cardHTML(c, i) {
  const isDeep = c.hops >= 3 || (c.score !== undefined && c.score <= 0);
  const hopCls = c.hops === 1 ? 'hop-1' : c.hops === 2 ? 'hop-2' : c.hops >= 3 ? 'hop-3' : '';
  const hopLabel = c.hops ? c.hops + '-hop' : '';
  const hopEl = hopLabel
    ? `<span class="hop ${hopCls}${isDeep && c.hops >= 3 ? ' deep' : ''}">${hopLabel}${isDeep && c.score <= 0 ? ' 深跳' : ''}</span>`
    : '';
  const openLink = c.uri ? `<a class="open" href="${esc(c.uri)}" onclick="event.stopPropagation()" title="在笔记软件中打开">打开 ↗</a>` : '';
  return `<div class="card" data-id="${esc(c.id)}" data-title="${esc(c.title)}">
    <div class="top">
      <span class="rank">${i + 1}</span>
      <span class="title">${esc(c.title)}</span>
      <span class="id">${esc(c.id)}</span>
      <span class="type">${esc(c.type)}</span>
      ${hopEl}
      ${openLink}
    </div>
    ${c.path ? `<div class="path">${esc(c.path)}</div>` : ''}
    <div class="scores">${esc(scoreLine(c))}</div>
    <div class="actions">
      <button class="act" data-preview="${esc(c.id)}" onclick="event.stopPropagation(); showPreview(this.dataset.preview)">预览</button>
      <button class="act" data-similar="${esc(c.id)}" onclick="event.stopPropagation(); showSimilar(this.dataset.similar)">相似</button>
    </div>
  </div>`;
}

function esc(s) {
  return String(s == null ? '' : s).replace(/[&<>"']/g, c =>
    ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
}

// ---- 初始页：热门节点漂浮气泡 ----
async function renderHome() {
  $('#list').innerHTML = `<div class="hero">
      <div class="hero-title">图谱<span class="accent">漫游</span></div>
      <div class="hero-sub">你问一个点，它给你一片 —— 点击气泡开始漫游</div>
      <div class="bubbles" id="bubbles"></div>
    </div>`;
  $('#anchors').innerHTML = '';
  $('#meta').textContent = '';
  let hot = [];
  try {
    const r = await fetch('/api/hot?n=24');
    hot = await r.json();
  } catch (e) { hot = []; }
  const box = $('#bubbles');
  if (!box) return;
  const pool = hot.slice().sort(() => Math.random() - 0.5).slice(0, 10);
  if (!pool.length) {
    box.innerHTML = '<div class="empty">库里还没有节点</div>';
    return;
  }
  box.innerHTML = pool.map(b => {
    const w = 84 + Math.random() * 60;
    const style = 'left:' + (Math.random() * 82 + 5).toFixed(1) + '%;' +
      'top:' + (Math.random() * 62 + 26).toFixed(1) + '%;' +
      'width:' + w.toFixed(0) + 'px;' +
      '--dx:' + (Math.random() * 60 - 30).toFixed(0) + 'px;' +
      '--dy:' + (Math.random() * 40 - 20).toFixed(0) + 'px;' +
      '--dur:' + (8 + Math.random() * 8).toFixed(1) + 's;' +
      'animation-delay:' + (-Math.random() * 8).toFixed(1) + 's';
    return `<div class="bubble type-${esc(b.type)}" data-id="${esc(b.id)}" data-title="${esc(b.title)}"
        style="${style}" title="${esc(b.title)}">${esc(b.title)}</div>`;
  }).join('');
}

// ---- 关系查询（/api/relation）----
async function queryRelation() {
  const from = $('#rel-from').value.trim();
  const to = $('#rel-to').value.trim();
  const box = $('#rel-result');
  if (!from || !to) { box.innerHTML = '<div class="rel-empty">请输入两个节点名称或 ID</div>'; return; }
  box.innerHTML = '<div class="loading">查询关系…</div>';
  try {
    const r = await fetch('/api/relation?from=' + encodeURIComponent(from) + '&to=' + encodeURIComponent(to));
    const d = await r.json();
    if (d.error) { box.innerHTML = '<div class="rel-empty">' + esc(d.error) + '</div>'; return; }
    // 最短路径 + 双向 PPR 强度 + 激活值（white-box）
    let pathHtml = '';
    const path = d.path || [];
    const pathNodes = d.path_nodes || [];
    if (Array.isArray(path) && path.length) {
      // 优先用 path_nodes 的标题（web 层补全），否则退回 ID
      const frags = path.map((id, idx) => {
        const pn = pathNodes.find(n => n.id === id);
        const title = pn ? pn.title : id;
        return `<span class="rel-node" data-id="${esc(id)}" data-title="${esc(title)}">${esc(title)}</span>`;
      });
      pathHtml = '<div class="rel-path">' + frags.join('<span class="rel-arrow">→</span>') + '</div>';
    } else {
      pathHtml = '<div class="rel-empty">未找到连通路径</div>';
    }
    const stats = [];
    if (d.affinity !== undefined) stats.push('affinity ' + (+d.affinity).toFixed(4));
    if (d.activation !== undefined) stats.push('激活 ' + (+d.activation).toFixed(3) + (d.hops >= 0 ? ' (' + d.hops + '-hop)' : ''));
    if (d.ppr_from_to !== undefined) stats.push('ppr→ ' + (+d.ppr_from_to).toFixed(4));
    if (d.ppr_to_from !== undefined) stats.push('ppr← ' + (+d.ppr_to_from).toFixed(4));
    const evi = (d.evidence || []).map(ev => (ev.witnesses || []).join('、')).filter(Boolean);
    box.innerHTML = pathHtml +
      (stats.length ? '<div class="rel-stats">' + stats.join(' · ') + '</div>' : '') +
      (evi.length ? '<div class="rel-stats">证据: ' + esc(evi.join('；')) + '</div>' : '');
  } catch (e) {
    box.innerHTML = '<div class="rel-empty">查询失败: ' + esc(e.message) + '</div>';
  }
}

// ---- 节点详情预览（v0.1.11，前端 #3）：点卡片「预览」看 /api/node ----
async function showPreview(id) {
  let d;
  try {
    const r = await fetch('/api/node?id=' + encodeURIComponent(id));
    d = await r.json();
    if (d.error) throw new Error(d.error);
  } catch (e) {
    return alert('详情失败: ' + e.message);
  }
  const overlay = document.createElement('div');
  overlay.className = 'detail-overlay';
  const nb = (d.neighbors || []).map(n =>
    `<span class="dnod" data-id="${esc(n.id)}" data-title="${esc(n.title)}">${esc(n.title || n.id)}</span>`).join('');
  const bl = (d.backlinks || []).map(n =>
    `<span class="dnod" data-id="${esc(n.id)}" data-title="${esc(n.title)}">${esc(n.title || n.id)}</span>`).join('');
  overlay.innerHTML = `<div class="detail-card" onclick="event.stopPropagation()">
    <div class="dhead">
      <span class="dtitle">${esc(d.title || d.id)}</span>
      <span class="dtype">${esc(d.type || '')}</span>
      <span class="dclose" title="关闭">✕</span>
    </div>
    <div class="dmeta">id: ${esc(d.id)}${d.deg !== undefined ? ' · 度 ' + d.deg : ''}</div>
    <div class="dtext">${esc(d.text || '（无正文摘要）')}</div>
    <div class="dsec">邻居（${(d.neighbors || []).length}）</div>
    ${nb || '<div class="dempty">无邻居</div>'}
    <div class="dsec">被引用（${(d.backlinks || []).length}）</div>
    ${bl || '<div class="dempty">无被引用</div>'}
  </div>`;
  overlay.addEventListener('click', () => overlay.remove());
  overlay.querySelector('.dclose').onclick = () => overlay.remove();
  // 邻居/被引用点击 → 从该节点继续漫游 + 关闭详情
  overlay.querySelectorAll('.dnod').forEach(n => {
    n.onclick = () => { overlay.remove(); roam(n.dataset.id, 'push', n.dataset.title || n.dataset.id); };
  });
  document.body.appendChild(overlay);
}

// ---- 结构相似（v0.1.11，backlog §3.1）：卡片「相似」→ 折叠面板 ----
async function showSimilar(id) {
  openOnly('#sim-panel');
  const box = $('#sim-result');
  box.innerHTML = '<div class="loading">查询相似…</div>';
  try {
    const r = await fetch('/api/similar?id=' + encodeURIComponent(id) + '&k=12');
    const d = await r.json();
    if (d.error) { box.innerHTML = '<div class="rel-empty">' + esc(d.error) + '</div>'; return; }
    const list = d.results || [];
    if (!list.length) { box.innerHTML = '<div class="rel-empty">没有相似节点</div>'; return; }
    box.innerHTML = list.map(s => {
      let title = s.title || s.id;
      // 显示当前查询节点标题为上下文
      const evi = (s.shared_titles || []).slice(0, 4).join('、');
      return `<div class="sim-item" data-id="${esc(s.id)}" data-title="${esc(title)}">
        <span>${esc(title)} <small style="color:var(--muted)">[${esc(s.type)}]</small></span>
        <span class="evi">${esc(evi ? '直连: ' + evi : '')}</span>
      </div>`;
    }).join('');
  } catch (e) {
    box.innerHTML = '<div class="rel-empty">查询失败: ' + esc(e.message) + '</div>';
  }
}

// ---- 导出当前漫游为 Markdown（v0.1.11，backlog §3.2）----
function exportMarkdown() {
  const q = $('#q').value.trim();
  let url = '/api/roam?export=1' + (q ? '&q=' + encodeURIComponent(q) : '');
  const qs = paramQS();
  if (qs) url += '&' + qs;
  const a = document.createElement('a');
  a.href = url;
  a.download = 'serendipity-roam.md';
  document.body.appendChild(a);
  a.click();
  a.remove();
}

// ---- 反馈统计（v0.1.11，backlog §3.3）：只读展示 ----
async function showStats() {
  openOnly('#stat-panel');
  const box = $('#stat-result');
  box.innerHTML = '<div class="loading">读取统计…</div>';
  try {
    const r = await fetch('/api/touch/stats?n=10');
    const d = await r.json();
    if (d.error) { box.innerHTML = '<div class="rel-empty">' + esc(d.error) + '</div>'; return; }
    const tag = (x) => `<span class="stat-tag">${esc(x.id)} <b>${x.count}</b></span>`;
    const targets = (d.targets || []).map(tag).join('') || '<span style="color:var(--muted)">无数据</span>';
    const sources = (d.sources || []).map(tag).join('') || '<span style="color:var(--muted)">无数据</span>';
    box.innerHTML =
      `<div class="stat-line">总点击：<b>${d.total || 0}</b> 次</div>` +
      `<div class="stat-line">被反复点击：</div><div>${targets}</div>` +
      `<div class="stat-line">点击来源：</div><div>${sources}</div>` +
      `<div style="color:var(--muted);font-size:11.5px;margin-top:8px">仅记录与只读统计，不参与排序（红线）</div>`;
  } catch (e) {
    box.innerHTML = '<div class="rel-empty">统计失败: ' + esc(e.message) + '</div>';
  }
}

// ---- 回到初始页 ----
function goHome() {
  stack = [''];
  pos = 0;
  roam('', 'replace');
}

// 浏览器前进/后退
window.addEventListener('popstate', e => {
  const q = (e.state && e.state.q) || '';
  if (pos > 0 && stack[pos - 1] === q) { pos--; }
  else if (pos < stack.length - 1 && stack[pos + 1] === q) { pos++; }
  else { stack = [q]; pos = 0; }
  roam(q, 'replace');
});

// ---- 事件委托：卡片 / 气泡 / 锚点 / 关系节点 / 相似项 统一点击 ----
document.addEventListener('click', e => {
  if (e.target.closest('a')) return; // 「打开 ↗」链接不拦截
  const rel = e.target.closest('.rel-node');
  if (rel && rel.dataset.id) {
    // 关系节点点击 → 填入"从"并漫游
    $('#rel-from').value = rel.dataset.title || rel.dataset.id;
    $('#q').value = rel.dataset.title || rel.dataset.id;
    roam(rel.dataset.id, 'push', rel.dataset.title || rel.dataset.id);
    return;
  }
  // 相似面板项点击（v0.1.11）
  const si = e.target.closest('.sim-item');
  if (si && si.dataset.id) {
    roam(si.dataset.id, 'push', si.dataset.title || si.dataset.id);
    return;
  }
  const el = e.target.closest('.card, .bubble, #anchors .anchor[data-id]');
  if (el && el.dataset.id) {
    $('#meta').textContent = '漫游中: ' + (el.dataset.title || el.title) + ' …';
    fetch('/api/touch', {
      method: 'POST', headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ target: el.dataset.id, from: $('#q').value || '' })
    }).catch(() => {});
    roam(el.dataset.id, 'push', el.dataset.title || el.title);
  }
});

// ---- 自动监听提示（轮询 stats 对比 revision）----
let lastRevision = null;
setInterval(async () => {
  try {
    const s = await (await fetch('/api/stats')).json();
    if (lastRevision === null) { lastRevision = s.revision || 0; return; }
    if ((s.revision || 0) !== lastRevision) {
      lastRevision = s.revision || 0;
      const m = $('#meta');
      if (m) m.textContent = '库已自动更新（节点 ' + s.nodes + '）——点击任意卡片可看最新，或点 ↻ 查看明细';
    }
  } catch (e) { /* 轮询失败静默 */ }
}, 30000);

// ---- 页面 JS 错误可见 ----
window.addEventListener('error', e => {
  const m = $('#meta');
  if (m) m.textContent = '页面错误: ' + (e.message || 'unknown');
});

// ---- 交互绑定 ----
$('#back').onclick = () => { if (pos > 0) history.back(); };
$('#home').onclick = goHome;
$('#brand').onclick = goHome;
$('#go').onclick = () => { const q = $('#q').value.trim(); if (q) roam(q, 'push'); };
$('#dice').onclick = roamRandom;
$('#q').addEventListener('keydown', e => { if (e.key === 'Enter') $('#go').click(); });
$('#rel-go').onclick = queryRelation;
$('#rel-from').addEventListener('keydown', e => { if (e.key === 'Enter') queryRelation(); });
$('#rel-to').addEventListener('keydown', e => { if (e.key === 'Enter') queryRelation(); });
$('#cfg-reset').onclick = resetParams;

function toggle(id, btn) {
  const el = $(id);
  const on = el.classList.toggle('hidden');
  if (btn && on) { btn.classList.add('active'); } else if (btn) { btn.classList.remove('active'); }
  // 同时只开一个面板，避免页面堆叠
  if (!el.classList.contains('hidden')) {
    ['#rel-panel', '#cfg-panel', '#sim-panel', '#stat-panel'].forEach(o => {
      if (o !== id) $(o).classList.add('hidden');
    });
  }
}
// openOnly：直接打开指定面板并关掉其它（相似/统计按钮不需要"再点一次关闭"逻辑用）
function openOnly(id) {
  ['#rel-panel', '#cfg-panel', '#sim-panel', '#stat-panel'].forEach(o => {
    $(o).classList.add('hidden');
  });
  $(id).classList.remove('hidden');
}
$('#rel-toggle').onclick = () => toggle('#rel-panel');
$('#cfg-toggle').onclick = () => toggle('#cfg-panel');
// 统计/相似按钮点击 → 打开面板并加载数据（showStats/showSimilar 内部通过 openOnly
// 打开面板并关掉其它——只开一个，避免与 toggle 的开关语义打架）
$('#stat-toggle').onclick = () => showStats();
$('#sim-close').onclick = () => $('#sim-panel').classList.add('hidden');
$('#stat-close').onclick = () => $('#stat-panel').classList.add('hidden');
$('#export').onclick = exportMarkdown;

// ---- 对账刷新 ----
$('#refresh').onclick = async () => {
  const btn = $('#refresh');
  btn.disabled = true;
  const hint = $('#meta');
  hint.textContent = '刷新中…';
  try {
    const r = await fetch('/api/refresh', { method: 'POST' });
    const d = await r.json();
    if (d.error) { hint.textContent = '刷新失败: ' + d.error; return; }
    hint.textContent = '已刷新: 新增 ' + d.added + ' · 更新 ' + d.updated +
      ' · 删除 ' + d.deleted + ' · 改名 ' + (d.renamed || 0) + ' · 未变 ' + d.unchanged +
      '（' + d.duration_ms + 'ms，节点 ' + d.nodes + '）';
    // 刷新后源信息可能变化
    fetch('/api/config').then(r => r.json()).then(c => {
      if (c.source) $('#source').innerHTML = '<span class="tag">源</span> ' + esc(c.source) +
        '<span class="tag">节点 ' + c.nodes + '</span><span class="tag">边 ' + c.edges + '</span>';
    }).catch(() => {});
    const q = $('#q').value.trim();
    if (q) roam(q, 'replace'); else renderHome();
  } catch (e) {
    hint.textContent = '刷新失败: ' + e.message;
  } finally {
    btn.disabled = false;
  }
};

// 初始：把初始状态入栈
const initQ = new URLSearchParams(location.search).get('q') || '';
stack = [initQ];
pos = 0;
roam(initQ, 'replace');
</script>
</body>
</html>
