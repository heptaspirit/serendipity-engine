<!DOCTYPE html>
<!--
  文件：internal/web/static/index.html（go:embed，Web 入口的可视化页面）
  模块：Serendipity Engine 图谱漫游 UI（纯前端，零依赖原生 JS）

  ▍设计语言（v0.1.6 换肤）
    采用 dsh web 同款 design language（Tokyo Night 风格暗色）：
      背景 #181926 · 面板 #1e2030 · 浮起面板 #24273a · 交互按钮 #363a4f
      正文 #cad3f5 · 弱化 #6e738d · 强调蓝 #7aa2f7 · 边界 rgba(255,255,255,.06/.12)
    保留 1/2/3-hop 配色（金/蓝/紫），整体更克制、贴近 dsh web。

  ▍功能
    - 搜索漫游（/api/roam）+ 🎲 随机漫步（/api/roam?random=1）+ / 键聚焦搜索
    - 卡片：点击任一卡片 = 从该节点继续漫游（push 历史栈）；预览（详情浮层）、
      相似（结构相似 Jaccard/Adamic-Adar）、打开（obsidian:// / orca-note:// / postMessage）
    - 侧滑抽屉：关系查询 / 相似 / 统计 / 参数 统一右侧抽屉（不挤占主区，主任务是漫游）
    - 导出当前漫游为 Markdown（/api/roam?export=1）
    - 反馈埋点（点击上报 /api/touch，只读统计 /api/touch/stats）
    - 自动监听提示 + is_pending（库有变化）提示条（/api/stats，roadmap #14）
    - 深跳节点（score≤0）：不显示无意义 0 分，改用「深跳」标签

  ▍前端 P0（v0.1.12，插件化前置，roadmap 阶段 2 #1）
    1. 紧凑嵌入模式：?embed=1 或 top!==self → body.embed 类——隐藏 hero/brand/页脚、
       搜索框 sticky 常驻、卡片间距收紧、.open 常显（窄面板无 hover）。
    2. postMessage 桥：嵌入时「打开」不跳外链，改发 {type:'open', id} 通知宿主就地打开
       （Obsidian openLinkText / 虎鲸 invokeBackend）；宿主回传 {type:'theme'} /
       {type:'locale'} / {type:'activeFile'}（Web UI 绝不直接调宿主 API，跨源也不允许）。
    3. 节点详情预览 / node（P0 项，v0.1.11 已落地，本版保留）。
    4. i18n（中英双语，覆盖全部用户可见文案）：文案集中一份字典，语言跟随宿主
       （postMessage {type:'locale'} 或 navigator.language；默认中文、英文兜底）。

  ▍修改记录
    v0.1.0  初版：漫游/锚点/卡片/历史栈/回退/初始页气泡
    v0.1.6  dsh web 设计语言换肤；设置抽屉暴露安全参数；深跳修复；关系查询
    v0.1.7  🎲 随机漫步按钮；rand_alpha 滑块
    v0.1.8  服务端注入 API token（__SEREN_TOKEN__），fetch 自动携带
    v0.1.11 卡片预览/相似；顶栏导出/统计；刷新摘要补改名
    v0.1.12 前端 P0：hero 改静态热门列表（移除漂浮气泡动画）、侧滑抽屉统一面板、
           卡片 .id 收敛（悬停提示）/ .scores 折叠（hover 展开）、🎲 升级带文字主按钮、
           ?embed=1 紧凑嵌入 + postMessage 桥、i18n 中英双语全部文案、is_pending 提示条。
-->
<html lang="zh">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Serendipity Engine</title>
<style>
  :root {
    /* dsh web 同款设计语言（Tokyo Night） */
    --bg: #181926; --panel: #1e2030; --surface: #24273a; --elevated: #363a4f;
    --text: #cad3f5; --muted: #6e738d; --border: rgba(255,255,255,.06);
    --border-strong: rgba(255,255,255,.12); --accent: #7aa2f7; --accent-2: #6384ff;
    --primary: #677fb5; --primary-hover: #7a90cc;
    --hop1: #e0af68; --hop2: #7aa2f7; --hop3: #bb9af7;
    --danger: #ed8796; --warn: #e0af68; --ok: #9ece6a;
    --radius: 12px; --radius-sm: 8px; --radius-pill: 999px;
    --shadow: 0 6px 20px rgba(0,0,0,.35);
    --font: -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC",
            "Hiragino Sans GB", "Microsoft YaHei", "Helvetica Neue", Arial, sans-serif;
  }
  /* 浅色主题（P1-7：主题跟随宿主；嵌入时宿主回传 {type:'theme', mode:'light'}） */
  :root[data-theme="light"] {
    --bg: #f5f6fa; --panel: #ffffff; --surface: #eef0f6; --elevated: #e3e6ef;
    --text: #2a2f3f; --muted: #7a8195; --border: rgba(0,0,0,.08);
    --border-strong: rgba(0,0,0,.14); --accent: #3a6ef0; --accent-2: #3757ff;
    --primary: #4a6bd0; --primary-hover: #5b7ae0;
    --shadow: 0 6px 18px rgba(0,0,0,.1);
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; }
  body { background: var(--bg); color: var(--text); font-family: var(--font);
         font-size: 15px; line-height: 1.5; -webkit-font-smoothing: antialiased; }
  button { font-family: var(--font); }
  a { color: var(--accent); text-decoration: none; }

  /* ---- 顶栏 ---- */
  header { position: sticky; top: 0; z-index: 10; padding: 12px 20px;
    border-bottom: 1px solid var(--border); background: color-mix(in srgb, var(--bg) 88%, #000);
    display: flex; align-items: center; gap: 12px; backdrop-filter: blur(6px); }
  .header-left, .header-right { display: flex; align-items: center; gap: 6px; }
  .header-right { margin-left: auto; }
  .brand { font-size: 16px; font-weight: 700; color: var(--text); margin: 0;
    cursor: pointer; letter-spacing: .2px; display: flex; align-items: center; gap: 8px; }
  .brand:hover { color: var(--accent); }
  .brand .tag { font-size: 11px; font-weight: 500; color: var(--muted);
    border: 1px solid var(--border-strong); border-radius: var(--radius-pill);
    padding: 1px 8px; }

  .icon-btn { width: 34px; height: 34px; display: inline-flex; align-items: center;
    justify-content: center; background: var(--surface); border: 1px solid var(--border);
    color: var(--text); border-radius: var(--radius-sm); cursor: pointer; font-size: 15px; }
  .icon-btn:hover:not(:disabled) { border-color: var(--accent); color: var(--accent); }
  .icon-btn:disabled { opacity: .35; cursor: default; }

  .btn { display: inline-flex; align-items: center; justify-content: center; gap: 6px;
    padding: 8px 16px; border-radius: var(--radius-pill); font-size: 14px; font-weight: 600;
    cursor: pointer; border: 1px solid var(--border-strong); background: var(--surface);
    color: var(--text); transition: background .15s, border-color .15s, transform .05s; }
  .btn:hover { border-color: var(--accent); }
  .btn:disabled { opacity: .45; cursor: default; }
  .btn.primary { background: var(--primary); color: #0e0f17; border-color: transparent; }
  :root[data-theme="light"] .btn.primary { color: #fff; }
  .btn.primary:hover { background: var(--primary-hover); }
  .btn.ghost { background: transparent; }
  .btn.sm { padding: 4px 12px; font-size: 12.5px; font-weight: 500; }

  main { max-width: 920px; margin: 0 auto; padding: 20px 20px 48px; }

  /* ---- 搜索 ---- */
  .search { display: flex; gap: 10px; margin-bottom: 10px; }
  .search input { flex: 1; background: var(--surface); border: 1px solid var(--border-strong);
    color: var(--text); padding: 12px 16px; border-radius: var(--radius); font-size: 15px;
    outline: none; }
  .search input::placeholder { color: var(--muted); }
  .search input:focus { border-color: var(--accent); }
  .search .btn { padding: 12px 22px; }

  .source-line { color: var(--muted); font-size: 12.5px; margin: 2px 0 8px;
    display: flex; align-items: center; gap: 6px; flex-wrap: wrap; }
  .source-line .tag { color: var(--muted); border: 1px solid var(--border);
    border-radius: var(--radius-sm); padding: 1px 6px; font-size: 11.5px; }

  /* 待刷新提示条（v0.1.12，roadmap #14） */
  .pending { display: flex; align-items: center; justify-content: space-between; gap: 10px;
    background: color-mix(in srgb, var(--warn) 14%, var(--panel));
    border: 1px solid color-mix(in srgb, var(--warn) 40%, transparent);
    border-radius: var(--radius-sm); padding: 8px 12px; color: var(--warn);
    font-size: 13px; margin-bottom: 12px; animation: fade .12s ease; }
  .pending.hidden { display: none; }
  .pending .btn { flex-shrink: 0; }

  /* 全局工具类：.hidden 覆盖任何 display（v0.1.15 修正——此前只有 .pending.hidden /
     .drawer-overlay.hidden 等特定组合，.search.hidden 无匹配规则导致隐藏失效） */
  .hidden { display: none !important; visibility: hidden; }

  /* ---- 侧滑抽屉（v0.1.12，统一面板） ---- */
  .drawer-overlay { position: fixed; inset: 0; background: rgba(0,0,0,.45); z-index: 30;
    animation: fade .12s ease; }
  .drawer-overlay.hidden { display: none; }
  .drawer { position: fixed; top: 0; right: 0; height: 100%; width: min(420px, 92%);
    background: var(--panel); border-left: 1px solid var(--border-strong);
    box-shadow: var(--shadow); z-index: 31; transform: translateX(100%);
    transition: transform .2s ease; display: flex; flex-direction: column; }
  .drawer.open { transform: translateX(0); }
  .drawer-head { display: flex; align-items: center; justify-content: space-between;
    padding: 14px 18px; border-bottom: 1px solid var(--border); font-weight: 700;
    font-size: 15px; }
  .drawer-head .dclose { cursor: pointer; color: var(--muted); font-size: 18px;
    background: none; border: none; }
  .drawer-head .dclose:hover { color: var(--accent); }
  .drawer-body { padding: 16px 18px; overflow: auto; flex: 1; font-size: 13.5px; }
  /* 嵌入时抽屉全宽 */
  body.embed .drawer { width: 100%; }

  /* 关系 + 相似 + 统计 + 参数 共用抽屉内容样式 */
  .rel-inputs { display: flex; gap: 8px; align-items: center; flex-wrap: wrap; }
  .rel-inputs input { flex: 1; min-width: 160px; background: var(--surface);
    border: 1px solid var(--border-strong); color: var(--text); padding: 10px 12px;
    border-radius: var(--radius-sm); font-size: 14px; outline: none; }
  .rel-inputs input:focus { border-color: var(--accent); }
  .rel-x { color: var(--muted); font-size: 16px; }
  .rel-result { margin-top: 12px; font-size: 13.5px; color: var(--text); }
  .rel-result .rel-path { display: flex; flex-wrap: wrap; gap: 6px; align-items: center; }
  .rel-node { background: var(--surface); border: 1px solid var(--border-strong);
    border-radius: var(--radius-sm); padding: 4px 10px; font-size: 13px; cursor: pointer; }
  .rel-node:hover { border-color: var(--accent); color: var(--accent); }
  .rel-arrow { color: var(--muted); }
  .rel-stats { margin-top: 10px; color: var(--muted); font-size: 12.5px; }
  .rel-empty { color: var(--muted); }

  .cfg-head { display: flex; align-items: center; justify-content: space-between;
    margin-bottom: 12px; font-weight: 600; font-size: 14px; }
  .cfg-group-label { color: var(--muted); font-size: 12px; text-transform: uppercase;
    letter-spacing: .5px; margin: 12px 0 6px; }
  .cfg-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(240px, 1fr));
    gap: 12px 20px; }
  .cfg-field { display: flex; flex-direction: column; gap: 4px; }
  .cfg-field .row { display: flex; align-items: center; justify-content: space-between; }
  .cfg-field .lbl { font-size: 13.5px; color: var(--text); }
  .cfg-field .val { font-size: 13px; color: var(--accent); font-variant-numeric: tabular-nums; }
  .cfg-field .hint { font-size: 11.5px; color: var(--muted); }
  .cfg-field input[type=range] { width: 100%; accent-color: var(--accent); cursor: pointer; }

  /* ---- 元信息 ---- */
  .meta { color: var(--muted); font-size: 13px; margin: 6px 0 12px; min-height: 18px; }
  .anchors { display: flex; gap: 6px; flex-wrap: wrap; margin-bottom: 14px; }
  .anchor { background: var(--surface); border: 1px solid var(--border-strong);
    border-radius: var(--radius-sm); padding: 5px 11px; font-size: 12.5px; color: var(--muted);
    cursor: pointer; }
  .anchor:hover { border-color: var(--accent); color: var(--accent); }
  .anchor.more { cursor: default; color: var(--muted); }
  .anchor.more:hover { border-color: var(--border-strong); color: var(--muted); }

  /* ---- 卡片（信息分级：标题/路径用户看，ID/分数 AI/调试看，后者默认收敛） ---- */
  .card { background: var(--panel); border: 1px solid var(--border); border-radius: var(--radius);
    padding: 13px 16px; margin-bottom: 8px; cursor: pointer;
    transition: border-color .15s, transform .08s, background .15s; }
  .card:hover { border-color: var(--accent); transform: translateY(-1px);
    box-shadow: 0 4px 12px rgba(0,0,0,.2); }
  .card:active { transform: scale(.99); }
  .card:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
  .card .top { display: flex; align-items: center; gap: 10px; flex-wrap: wrap; }
  .card .rank { color: var(--accent); font-weight: 700; min-width: 24px; font-size: 14px; }
  .card .title { font-size: 15px; font-weight: 600; }
  .card .id { display: none; } /* v0.1.12：ID 收敛为 title 悬停提示，不常显 */
  .card .type { font-size: 11px; border: 1px solid var(--border-strong); border-radius: var(--radius-sm);
    padding: 1px 8px; color: var(--muted); }
  .card .hop { font-size: 11px; border-radius: var(--radius-sm); padding: 1px 8px; font-weight: 700; }
  .hop-1 { color: var(--hop1); border: 1px solid color-mix(in srgb, var(--hop1) 45%, transparent); }
  .hop-2 { color: var(--hop2); border: 1px solid color-mix(in srgb, var(--hop2) 45%, transparent); }
  .hop-3 { color: var(--hop3); border: 1px solid color-mix(in srgb, var(--hop3) 45%, transparent); }
  .hop.deep { color: var(--muted); border-color: var(--border-strong); }
  .card .open { margin-left: auto; font-size: 12.5px; color: var(--accent);
    border: 1px solid var(--border-strong); border-radius: var(--radius-sm); padding: 2px 9px; }
  .card .open:hover { border-color: var(--accent); background: color-mix(in srgb, var(--accent) 12%, transparent); }
  .card .meta-line { color: var(--muted); font-size: 12px; margin-top: 6px; line-height: 1.6; }
  .card .path { color: var(--muted); font-size: 12px; margin-top: 5px; word-break: break-all; }
  .card .scores { color: var(--muted); font-size: 11.5px; margin-top: 3px;
    opacity: .3; transition: opacity .15s; }
  .card:hover .scores { opacity: 1; } /* v0.1.12：.scores 默认折叠，hover 展开 */

  /* ---- 初始页 hero（v0.1.12：改静态热门列表，移除漂浮气泡动画） ---- */
  .hero { padding: 28px 20px 20px; margin-top: 8px; text-align: center;
    border: 1px solid var(--border); border-radius: var(--radius);
    background: radial-gradient(ellipse at 30% 20%, var(--panel) 0%, var(--bg) 72%); }
  .hero-title { font-size: 28px; font-weight: 800; color: var(--text); letter-spacing: .5px; }
  .hero-title .accent { color: var(--accent); }
  .hero-sub { color: var(--muted); font-size: 13.5px; margin: 8px 0 16px; }
  .hot-tags { display: flex; flex-wrap: wrap; gap: 10px; justify-content: center; max-width: 760px;
    margin: 0 auto; }
  .bubble { border-radius: var(--radius-pill); display: inline-flex; align-items: center;
    justify-content: center; cursor: pointer; border: 1px solid var(--border-strong);
    background: var(--panel); color: var(--text); font-size: 12.5px; padding: 6px 14px;
    font-weight: 500; max-width: 180px; overflow: hidden; text-overflow: ellipsis;
    white-space: nowrap; }
  .bubble:hover { border-color: var(--accent); color: var(--accent); z-index: 2; }
  .type-人物 { border-color: color-mix(in srgb, var(--hop1) 55%, transparent); color: var(--hop1); }
  .type-设定 { border-color: color-mix(in srgb, var(--hop2) 55%, transparent); color: var(--hop2); }
  .type-线索 { border-color: color-mix(in srgb, var(--hop3) 55%, transparent); color: var(--hop3); }
  .type-ADR  { border-color: color-mix(in srgb, var(--ok) 55%, transparent); color: var(--ok); }
  .type-doc  { border-color: color-mix(in srgb, var(--hop2) 55%, transparent); color: var(--hop2); }
  .type-block{ border-color: color-mix(in srgb, var(--muted) 45%, transparent); color: var(--muted); }
  .type-note { border-color: var(--border-strong); color: var(--muted); }

  .fallback { background: color-mix(in srgb, var(--warn) 12%, var(--panel));
    border: 1px solid color-mix(in srgb, var(--warn) 40%, transparent); border-radius: var(--radius-sm);
    padding: 10px 14px; color: var(--warn); font-size: 13px; margin-bottom: 12px; }
  .empty { color: var(--muted); text-align: center; padding: 48px 0; font-size: 14px; }
  .deadend { background: color-mix(in srgb, var(--warn) 16%, var(--panel));
    border: 2px solid var(--warn); color: var(--warn);
    border-radius: var(--radius); padding: 26px 18px; text-align: center; font-size: 17px;
    font-weight: 700; margin-bottom: 12px; }
  .deadend-sub { font-size: 13px; font-weight: 400; color: var(--muted); margin-top: 8px; }
  .hint { color: var(--muted); font-size: 12px; margin-top: 24px; text-align: center; }

  /* 加载态 */
  .loading { color: var(--muted); text-align: center; padding: 24px 0; font-size: 13px; }

  /* 卡片动作按钮（预览 / 相似，v0.1.11） */
  .card .actions { display: flex; gap: 6px; margin-top: 8px; }
  .card .act { font-size: 12px; color: var(--muted); border: 1px solid var(--border-strong);
    border-radius: var(--radius-sm); padding: 2px 9px; cursor: pointer; background: transparent; }
  .card .act:hover { border-color: var(--accent); color: var(--accent); }

  /* 节点详情预览浮层（v0.1.11，前端 #3） */
  .detail-overlay { position: fixed; inset: 0; background: rgba(0,0,0,.5); z-index: 20;
    display: flex; align-items: center; justify-content: center; padding: 20px;
    animation: fade .12s ease; }
  .detail-card { width: min(560px, 100%); max-height: 80vh; overflow: auto;
    background: var(--panel); border: 1px solid var(--border-strong); border-radius: var(--radius);
    padding: 18px 20px; box-shadow: var(--shadow); }
  .detail-card .dhead { display: flex; align-items: center; gap: 10px; margin-bottom: 10px; }
  .detail-card .dtitle { font-size: 17px; font-weight: 700; }
  .detail-card .dtype { font-size: 11px; border: 1px solid var(--border-strong);
    border-radius: var(--radius-sm); padding: 1px 8px; color: var(--muted); }
  .detail-card .dclose { margin-left: auto; cursor: pointer; color: var(--muted); font-size: 18px;
    background: none; border: none; }
  .detail-card .dclose:hover { color: var(--accent); }
  .detail-card .dmeta { color: var(--muted); font-size: 12.5px; margin-bottom: 10px; word-break: break-all; }
  .detail-card .dtext { font-size: 13px; color: var(--text); line-height: 1.6; margin-bottom: 12px;
    white-space: pre-wrap; max-height: 220px; overflow: auto; background: var(--surface);
    border: 1px solid var(--border); border-radius: var(--radius-sm); padding: 10px 12px; }
  .detail-card .dsec { font-size: 12px; color: var(--muted); text-transform: uppercase;
    letter-spacing: .5px; margin: 10px 0 6px; }
  .detail-card .dneighbors { display: flex; flex-wrap: wrap; gap: 6px; }
  .detail-card .dnod { background: var(--surface); border: 1px solid var(--border-strong);
    border-radius: var(--radius-sm); padding: 4px 10px; font-size: 13px; cursor: pointer; }
  .detail-card .dnod:hover { border-color: var(--accent); color: var(--accent); }
  .detail-card .dempty { color: var(--muted); font-size: 12.5px; }

  /* 相似/统计 list in drawer */
  #sim-result .sim-item { display: flex; align-items: center; justify-content: space-between;
    padding: 6px 8px; border-radius: var(--radius-sm); cursor: pointer; font-size: 13.5px; }
  #sim-result .sim-item:hover { background: var(--surface); }
  #sim-result .sim-item .evi { color: var(--muted); font-size: 11.5px; }
  #stat-result .stat-line { color: var(--muted); margin: 6px 0; font-size: 13px; }
  #stat-result .stat-tag { display: inline-block; background: var(--surface);
    border: 1px solid var(--border-strong); border-radius: var(--radius-sm);
    padding: 2px 8px; font-size: 12px; margin: 2px 3px 2px 0; }

  @keyframes fade { from { opacity: 0; transform: translateY(-4px); } to { opacity: 1; transform: none; } }

  /* ---- 紧凑嵌入模式（v0.1.12，前端 P0-1） ---- */
  body.embed header { padding: 8px 12px; }
  /* 只藏品牌，不藏 header-right 按钮文字——那些按钮（随便逛逛/导出/统计/关系/参数）
     是纯文字无图标，藏了文字按钮就成空壳不可见。窄屏(<560px)仍由下方 media 藏文字。 */
  body.embed .brand { display: none; }
  body.embed main { max-width: none; padding: 12px; }
  body.embed .search { position: sticky; top: 0; z-index: 5; background: var(--bg);
    padding: 8px 0; margin-bottom: 6px; }
  body.embed .card { padding: 10px 12px; margin-bottom: 6px; }
  body.embed .card .open { opacity: 1; }
  body.embed .hint, body.embed .source-line .tag { display: none; }
  body.embed .hero-title, body.embed .hero-sub { display: none; }

  /* 无库启动选库引导（v0.1.15） */
  .vault-setup { max-width: 560px; margin: 8vh auto 0; text-align: center; }
  .vault-setup .vault-title { margin: 0 0 8px; }
  .vault-setup .vault-sub { color: var(--muted); margin: 0 0 16px; font-size: 13px; }
  .vault-setup .search { justify-content: center; }
  .vault-setup #vault-path { flex: 1; max-width: 360px; }

  /* 当前节点操作栏（v0.1.15）：与顶栏按钮同款（btn ghost sm）+ 锚点胶囊语言。
     按钮在此加大（相对全局 btn.sm 的 padding 4px/12px）——用户反馈太小。 */
  .current-node { display: flex; align-items: center; gap: 8px; flex-wrap: wrap;
    margin: 4px 0 12px; padding: 8px 12px; background: var(--surface);
    border: 1px solid var(--border-strong); border-radius: var(--radius-sm); }
  .current-node.hidden { display: none; }
  .current-node .cur-label { color: var(--muted); font-size: 13px; }
  .current-node .cur-title { font-weight: 600; font-size: 14px; margin-right: 6px; overflow: hidden;
    text-overflow: ellipsis; white-space: nowrap; max-width: 40%; }
  .current-node .btn { padding: 7px 16px; font-size: 13.5px; font-weight: 600; }

  /* 已配库状态条（v0.1.15）：配置完成后的顶端确认 */
  .vault-status { display: inline-flex; align-items: center; gap: 8px; margin-bottom: 8px;
    padding: 6px 12px; background: var(--surface); border: 1px solid var(--border-strong);
    border-radius: var(--radius-pill); font-size: 12.5px; color: var(--muted); }
  .vault-status.hidden { display: none; }
  .vault-status .vs-dot { width: 8px; height: 8px; border-radius: 50%; background: var(--ok); }
  .vault-status .vs-dot.off { background: var(--warn); }
  .vault-status b { color: var(--text); }

  /* MCP 状态 + 一键配置（v0.2.0） */
  .mcp-panel { margin: 8px 0; padding: 10px 12px; background: var(--surface);
    border: 1px solid var(--border-strong); border-radius: var(--radius); font-size: 12.5px;
    color: var(--muted); max-width: 640px; }
  .mcp-panel.hidden { display: none; }
  .mcp-head { display: inline-flex; align-items: center; gap: 8px; flex-wrap: wrap; }
  .mcp-head .vs-dot { width: 8px; height: 8px; border-radius: 50%; background: var(--ok); }
  .mcp-head .vs-dot.off { background: var(--warn); }
  .mcp-head b { color: var(--text); }
  .mcp-head .tag.ok { background: rgba(80,250,123,.15); color: var(--ok); }
  .mcp-head .tag.off { background: rgba(247,118,142,.15); color: var(--warn); }

    border: 1px solid var(--border-strong); border-radius: var(--radius); font-size: 12px; line-height: 1.5; }

  @media (max-width: 560px) {

    .header-right .btn .txt { display: none; }

const $$ = s => Array.from(document.querySelectorAll(s));

    mcpEnable: '启用', mcpDisable: '停用', mcpCopyConfig: '一键配置（复制）',

  },
  en: {

    home: 'Home', back: 'Back', refresh: 'Refresh (re-parse & sync)',
    dice: 'Random walk', export: 'Export', stats: 'Stats',
    relation: 'Relation', params: '⚙ Params', diceTitle: '🎲 Roam',
    exportTitle: 'Export current roam as Markdown', statsTitle: 'Click stats (read-only)',
    relTitle: 'Relation lookup', cfgTitle: 'Roam params', justRoam: 'Roam',
    searchPh: 'Note name / tag / any word…', roamBtn: 'Roam',
    relFromPh: 'Node A (name/ID)', relToPh: 'Node B (name/ID)', relGo: 'Query',
    relEmpty: 'Enter two node names or IDs', relNoPath: 'No path found',
    relFail: 'Query failed', relStats: 'relation', relEvidence: 'evidence',
    simTitle: 'Similar nodes', simSub: 'share neighbors but not linked', simEmpty: 'No similar nodes',
    simLoading: 'Querying similar…', simFail: 'Query failed', simDirect: 'shared',
    statTitle: 'Click stats', statSub: 'read-only, no ranking impact', statLoading: 'Reading stats…',
    statTotal: 'Total clicks', statTargets: 'Most clicked', statSources: 'Click sources',
    statNoData: 'no data', statFoot: 'Recorded & read-only — no ranking impact (red-line)', statFail: 'Stats failed',
    cfgTitle2: 'Roam params', cfgReset: 'Reset defaults',
    hint: '🎲 Roam · click any card to continue from that node · ⚙ Params to tune',
    loading: 'Loading…', noResult: 'No hit — nothing in the library',
    deadend: '⚠ This node is a dead end', deadendSub: 'It has no related nodes — try another keyword, or press ⌂ to go home',
    quiet: '🎲 This node is quiet, no cluster — roll again',
    anchor: 'anchor', randomAnchor: '🎲 Random start', moreAnchors: '… {n} anchors total',
    fallbackSearch: 'Anchor failed → fallback to full-text search', fallbackSparse: 'Query node has few links → full-text fallback',
    roamFrom: 'Continue from "{x}"', roaming: 'Roaming: {x} …', randomStart: '🎲 Random start (roll again for another; click a card to continue)',
    preview: 'Preview', similar: 'Similar', open: 'Open ↗', deep: 'deep',
    hitCount: 'hit {n} times', updated: 'Library updated (nodes {n})',
    refreshDone: 'Refreshed: +{a} ~{u} -{d} ↦{r} ~{c} ({ms}ms, {n} nodes)',
    refreshFail: 'Refresh failed', refreshing: 'Refreshing…', reqFail: 'Request failed', pageErr: 'Page error',
    detailFail: 'Detail failed', previewTextNone: '(no text summary)', neighbors: 'Neighbors', backlinks: 'Backlinks',
    noNeighbors: 'no neighbors', noBacklinks: 'no backlinks', deg: 'deg',
    pendingText: 'Library changed, auto-refresh in ~1 min', pendingNow: 'Refresh now',
    exportName: 'serendipity-roam.md', exportTitle2: 'Export Markdown',
    vaultTitle: 'Choose a library', vaultSub: 'Engine started without a library — point it at your notes (Obsidian vault or Orca .db) to begin',
    vaultPh: 'Library path (vault dir / OrcaNote.db)', vaultGo: 'Configure', vaultFail: 'Configure failed',
    curNodePh: 'Current node', relFromCur: 'Relation: current node',
    mcpTitle: 'AI access (MCP)', mcpTransport: 'Transport', mcpEnabled: 'Enabled', mcpDisabled: 'Disabled',
    mcpTools: 'Tools', mcpConfigured: 'Configured', mcpNotConfigured: 'Not configured',
    mcpEnable: 'Enable', mcpDisable: 'Disable', mcpCopyConfig: 'One-click config (copy)',
    mcpCopied: 'Copied to clipboard', mcpCopyFail: 'Copy failed', mcpToggleFail: 'Toggle failed',
    mcpConfigHint: 'Paste the config below into your MCP client (DeepSeek Harness dsh / Codex / Claude Desktop etc.) under mcpServers to connect.',
    mcpNoVault: 'Configure your library first; MCP can only serve data afterwards.',
  }
};
let lang = (navigator.language || 'zh').toLowerCase().startsWith('zh') ? 'zh' : 'en';
function t(key, vars) {
  let s = (I18N[lang] || I18N.zh)[key];
  if (s === undefined) s = I18N.zh[key] || key;
  if (vars) for (const k in vars) s = s.replace('{' + k + '}', vars[k]);
  return s;
}

// ---- 紧凑嵌入模式（前端 P0-1）：?embed=1 或 不在顶层（iframe 嵌入）→ body.embed ----
if (new URLSearchParams(location.search).has('embed') || window.top !== window.self) {
  document.body.classList.add('embed');
}
const embedded = document.body.classList.contains('embed');

// ==========================================================================
// postMessage 桥（前端 P0-2）：Web UI 只发 {type:'open', id}；宿主注入 theme/locale/activeFile。
// 跨源 iframe 物理隔离 → UI 绝不直接调宿主 API；换宿主只重写壳的注入部分。
// ==========================================================================
window.addEventListener('message', e => {
  const d = e.data || {};
  if (d.type === 'theme' && (d.mode === 'light' || d.mode === 'dark')) {
    document.documentElement.dataset.theme = d.mode;
    // 宿主（Obsidian 插件）注入其主题配色 → 用内联变量覆盖本引擎 token，
    // 使界面颜色跟随宿主主题。宿主空值（某一 CSS 变量未定义）跳过。
    if (d.colors) {
      const map = { '--bg': d.colors.bg, '--panel': d.colors.panel,
        '--surface': d.colors.surface, '--text': d.colors.text, '--muted': d.colors.muted,
        '--accent': d.colors.accent, '--accent-2': d.colors.accent,
        '--primary': d.colors.accent, '--border': d.colors.border,
        '--border-strong': d.colors.border };
      const st = document.documentElement.style;
      for (const k in map) if (map[k]) st.setProperty(k, map[k]);
    }
  } else if (d.type === 'locale' && (d.lang === 'zh' || d.lang === 'en')) {
    lang = d.lang;
    applyStaticI18n();
  } else if (d.type === 'activeFile' && d.id) {
    // 宿主告知当前在看哪篇 → 可作命令锚点（预留；本版仅记录）
    window.__activeFile = d.id;
  }
}, false);

// 打开请求：嵌入时走 postMessage 桥（宿主 openLinkText/invokeBackend），否则跳外链。
// 带上 uri（obsidian:// / orca-note://）——宿主优先用其解码 file 路径跳回（更可靠）。
function openNode(uri, id) {
  if (embedded) {
    window.parent.postMessage({ type: 'open', id, uri }, '*');
    return;
  }
  const a = document.createElement('a');
  a.href = uri || '#';
  a.target = '_blank';
  document.body.appendChild(a);
  a.click();
  a.remove();
}

// ==========================================================================
// API 鉴权（v0.1.8）：服务端注入 token，包装 fetch 自动携带。
// ==========================================================================
const __API_TOKEN__ = '__SEREN_TOKEN__';
const __origFetch = window.fetch;
window.fetch = (url, opts) => {
  opts = opts || {};
  opts.headers = Object.assign({ 'X-Seren-Token': __API_TOKEN__ }, opts.headers || {});
  return __origFetch(url, opts);
};

// ---- 可调参数状态（默认 /api/config，localStorage 记忆）----
let params = {};
let paramDefs = [];
const PARAMS_KEY = 'seren.params';
function loadSavedParams() { try { return JSON.parse(localStorage.getItem(PARAMS_KEY) || '{}'); } catch (e) { return {}; } }
function saveParams() { try { localStorage.setItem(PARAMS_KEY, JSON.stringify(params)); } catch (e) {} }
function paramQS() { return Object.keys(params).map(k => k + '=' + encodeURIComponent(params[k])).join('&'); }
function initParams(cfg) {
  paramDefs = cfg.params || [];
  const saved = loadSavedParams();
  params = {};
  for (const d of paramDefs) params[d.key] = (saved[d.key] !== undefined) ? +saved[d.key] : +d.default;
  renderCfg();
}

// ---- 静态 i18n：给带 data-i18n 的元素与 placeholder 填充文案 ----
function applyStaticI18n() {
  $$('[data-i18n]').forEach(el => { el.textContent = t(el.dataset.i18n); });
  $$('[data-i18n-ph]').forEach(el => { el.placeholder = t(el.dataset.i18nPh); });
  $$('[data-i18n-title]').forEach(el => { el.title = t(el.dataset.i18nTitle); });
  if ($('#q')) $('#q').placeholder = t('searchPh');
  const go = $('#go'); if (go) go.textContent = t('roamBtn');
  const hint = $('#hint'); if (hint) hint.textContent = t('hint');
  const dice = $('#dice'); if (dice) dice.innerHTML = '<span class="txt">' + t('diceTitle') + '</span>';
  updateSourceLine();
}
function updateSourceLine() {
  const line = $('#source');
  if (!line) return;
  const src = (line.dataset.source || ''), nodes = line.dataset.nodes, edges = line.dataset.edges;
  if (!src) return;
  line.innerHTML = '<span class="tag">' + t('source') + '</span> ' + esc(src) +
    '<span class="tag">' + t('node') + ' ' + nodes + '</span><span class="tag">' + t('edge') + ' ' + edges + '</span>';
}

// ---- 侧滑抽屉（v0.1.12，前端 9.4）----
const drawer = $('#drawer');
function openDrawer(title, html) {
  $('#drawer-title').textContent = title;
  $('#drawer-body').innerHTML = html;
  $('#drawer-overlay').classList.remove('hidden');
  drawer.classList.add('open');
}
function closeDrawer() {
  $('#drawer-overlay').classList.add('hidden');
  drawer.classList.remove('open');
}
$('#drawer-overlay').onclick = closeDrawer;
$('#drawer-close').onclick = closeDrawer;

// ==========================================================================
// 显示版本 & 源信息
// ==========================================================================
fetch('/api/config').then(r => r.json()).then(cfg => {
  initParams(cfg);
  if (cfg.version && $('#ver')) $('#ver').textContent = cfg.version;
  const line = $('#source');
  if (cfg.source) {
    line.dataset.source = cfg.source; line.dataset.nodes = cfg.nodes; line.dataset.edges = cfg.edges;
    updateSourceLine();
  }
  // 已配库状态条（v0.1.15）：configured=true → 显示库名 + 规模
  if (cfg.configured === true) renderVaultStatus(cfg.vault, cfg.nodes, cfg.edges);
  // 无库启动（v0.1.15）：configured=false → 显示选库引导，隐藏主搜索
  if (cfg.configured === false) showVaultSetup();
  // MCP 状态 + 一键配置（v0.2.0）：无论是否配库都查询并显示
  renderMCP();
}).catch(() => {
  fetch('/api/stats').then(r => r.json()).then(s => {
    if (s.version && $('#ver')) $('#ver').textContent = s.version;
    if (s.configured === true) renderVaultStatus(s.vault, s.nodes, s.edges);
    if (s.configured === false) showVaultSetup();
    renderMCP();
  }).catch(() => {});
});
applyStaticI18n();

// ---- MCP 状态 + 一键配置（v0.2.0）：读 /api/mcp/status，显示 AI 接入状态，
// 配库后给出 mcpServers 配置（endpoint /mcp + token）供一键复制；可启停。 ----
async function renderMCP() {
  const el = $('#mcp-panel');
  if (!el) return;
  let st;
  try { st = await (await fetch('/api/mcp/status')).json(); }
  catch (e) { el.classList.add('hidden'); return; } // 无 MCP（旧服务）→ 隐藏
  // 4xx 说明后端无 /api/mcp（未启用 MCP 的旧版）→ 隐藏
  if (st.enabled === undefined) { el.classList.add('hidden'); return; }
  el.classList.remove('hidden');
  const cfg = st.configured;
  const on = st.enabled;
  const tools = st.tools || 0;
  const transport = st.transport || (st.endpoint ? 'streamable-http' : 'stdio');
  const badge = on
    ? '<span class="tag ok">' + t('mcpEnabled') + '</span>'
    : '<span class="tag off">' + t('mcpDisabled') + '</span>';
  const cfgBadge = cfg
    ? '<span class="tag">' + t('mcpConfigured') + '</span>'
    : '<span class="tag warn">' + t('mcpNotConfigured') + '</span>';
  el.innerHTML = `
    <div class="mcp-head"><span class="vs-dot"></span>${t('mcpTitle')} ${badge} ${cfgBadge}</div>
    <div class="mcp-body">
      <span class="meta">${t('mcpTransport')}: <b>${esc(transport)}</b> · ${t('mcpTools')}: <b>${tools}</b></span>
      <div class="mcp-actions">
        <button id="mcp-toggle" class="btn ghost sm">${on ? t('mcpDisable') : t('mcpEnable')}</button>
        <button id="mcp-copy" class="btn primary sm">${t('mcpCopyConfig')}</button>
      </div>
      <div id="mcp-msg" class="mcp-msg"></div>
      <div id="mcp-cfg" class="mcp-cfg hidden"></div>
    </div>`;
  const toggle = $('#mcp-toggle');
  if (toggle) toggle.onclick = async () => {
    try {
      await fetch('/api/mcp/' + (on ? 'disable' : 'enable'), { method: 'POST' });
      renderMCP();
    } catch (e) { const m = $('#mcp-msg'); m.textContent = t('mcpToggleFail'); }
  };
  const copy = $('#mcp-copy');
  if (copy) copy.onclick = () => buildAndCopyMCP(cfg, st);
  if (!cfg) {
    const msg = $('#mcp-msg');
    if (msg) msg.textContent = t('mcpNoVault');
  }
}

// buildAndCopyMCP 生成 mcpServers 配置并复制到剪贴板（endpoint /mcp + token）。
function buildAndCopyMCP(configured, st) {
  const cfg = $('#mcp-cfg');
  const msg = $('#mcp-msg');
  const token = __API_TOKEN__;
  const flavor = configured
    ? { type: 'streamable-http', url: '/mcp', headers: { 'X-Seren-Token': token } }
    : null;
  // 当前 serve 是 streamable-http；给出注入 host 的完整配置
  const host = location.origin || 'http://127.0.0.1:8080';
  const mcpConfig = {
    mcpServers: {
      seren: {
        type: 'streamable-http',
        url: host + (st.endpoint || '/mcp'),
        headers: { 'X-Seren-Token': token },
      }
    }
  };
  const text = JSON.stringify(mcpConfig, null, 2);
  if (cfg) {
    cfg.classList.remove('hidden');
    cfg.innerHTML = '<div class="mcp-hint">' + esc(t('mcpConfigHint')) + '</div><pre>' + esc(text) + '</pre>';
  }
  if (msg) msg.textContent = '';
  const copy = async () => {
    try {
      await navigator.clipboard.writeText(text);
      if (msg) msg.textContent = t('mcpCopied');
    } catch (e) {
      // clipboard 不可用（非常规上下文）→ 退化为手动选中
      if (cfg) { const pre = cfg.querySelector('pre'); if (pre) { const r = document.createRange(); r.selectNodeContents(pre); const sel = window.getSelection(); sel.removeAllRanges(); sel.addRange(r); } }
      if (msg) msg.textContent = t('mcpCopyFail');
    }
  };
  copy();
}

// ---- 漫游历史栈（与浏览器 history 同步）----
let stack = [];
let pos = -1;

async function roam(query, mode, display) {
  let d;
  try {
    const qs = paramQS();
    const url = '/api/roam?q=' + encodeURIComponent(query) + (qs ? '&' + qs : '');
    const r = await fetch(url);
    d = await r.json();
  } catch (e) { $('#meta').textContent = t('reqFail') + ': ' + e.message; return; }
  $('#q').value = display || query;
  if (display && mode === 'push') $('#meta').textContent = t('roamFrom', { x: display });
  if (mode === 'push') {
    stack = stack.slice(0, pos + 1);
    stack.push(query); pos++;
    history.pushState({ q: query }, '', '?q=' + encodeURIComponent(query));
  } else if (mode === 'replace') {
    history.replaceState({ q: query }, '', '?q=' + encodeURIComponent(query));
  }
  $('#back').disabled = pos <= 0;
  renderOutcome(d, query, false);
}

async function roamRandom() {
  let d;
  try {
    const qs = paramQS();
    const r = await fetch('/api/roam?random=1' + (qs ? '&' + qs : ''));
    d = await r.json();
  } catch (e) { $('#meta').textContent = t('reqFail') + ': ' + e.message; return; }
  const anchor = (d.anchors || [])[0];
  $('#q').value = anchor && anchor.title ? anchor.title : '';
  $('#meta').textContent = t('randomStart');
  renderOutcome(d, '', true);
}

function renderOutcome(d, query, listMode) {
  const anchors = (d.anchors || []).slice().sort((a, b) => (b.match - a.match) || (b.deg - a.deg));
  const shownA = anchors.slice(0, 5);
  $('#anchors').innerHTML = '';
  if (shownA.length) {
    $('#anchors').innerHTML = shownA.map(a =>
      `<span class="anchor" data-id="${esc(a.id)}" data-title="${esc(a.title)}"
         title="${t('roamFrom', { x: a.title })}">${a.random ? t('randomAnchor') : t('anchor')}: ${esc(a.title)} (${esc(a.type)})</span>`).join('');
    if (anchors.length > shownA.length) {
      const more = document.createElement('span');
      more.className = 'anchor more';
      more.textContent = t('moreAnchors', { n: anchors.length });
      $('#anchors').appendChild(more);
    }
  }
  $('#fallback').innerHTML = '';
  if (d.fallback === 1) $('#fallback').innerHTML = '<div class="fallback">' + t('fallbackSearch') + '</div>';
  else if (d.fallback === 2) $('#fallback').innerHTML = '<div class="fallback">' + t('fallbackSparse') + '</div>';

  // 当前节点操作栏（v0.1.15）：漫游锚定后，对主锚点提供 详情/相似/关系 一键操作。
  // 用户需求：对"当前打开的节点"能直接看详情、找相似、与其他节点对比关系。
  // v0.1.15 别名：主锚点标题若非人读的（如"人物_002"），尽量显示别名（/api/node aliases）。
  const cur = document.getElementById('current-node');
  if (cur) {
    if (shownA.length) {
      const master = shownA[0];
      cur.classList.remove('hidden');
      const curTitle = cur.querySelector('.cur-title');
      cur.innerHTML = `<span class="cur-label">${t('curNodePh')}</span>
        <span class="cur-title" data-id="${esc(master.id)}" title="${esc(master.id)}">${esc(master.title)}</span>
        <button class="btn ghost sm" data-cur="${esc(master.id)}" data-cur-act="preview">${t('preview')}</button>
        <button class="btn ghost sm" data-cur="${esc(master.id)}" data-cur-act="similar">${t('similar')}</button>
        <button class="btn ghost sm" data-cur="${esc(master.id)}" data-cur-act="relation">${t('relTo')}</button>`;
      loadNodeAlias(master.id).then(a => {
        const tEl = cur.querySelector('.cur-title');
        if (a && tEl) { tEl.textContent = a; tEl.style.fontStyle = 'italic'; tEl.style.color = 'var(--accent)'; }
      });
    } else {
      cur.classList.add('hidden');
    }
  }

  const list = $('#list');
  if (!query && !listMode) { renderHome(); return; }
  const cards = (d.results || []).concat((d.fallback_hits || []).map(h => ({
    id: h.id, title: h.title, type: h.type, hops: 0,
    path: h.id, note: t('hitCount', { n: h.count })
  })));
  if (!cards.length) {
    const isRandom = !!(d.anchors || [])[0] && d.anchors[0].random;
    if (d.fallback === 2) {
      list.innerHTML = `<div class="deadend">${t('deadend')}<div class="deadend-sub">${t('deadendSub')}</div></div>`;
    } else if (isRandom) {
      list.innerHTML = '<div class="empty">' + t('quiet') + '</div>';
    } else {
      list.innerHTML = '<div class="empty">' + t('noResult') + '</div>';
    }
    return;
  }
  list.innerHTML = cards.map((c, i) => cardHTML(c, i)).join('');
}

function scoreLine(c) {
  if (c.note) return c.note;
  const parts = [];
  if (c.score !== undefined && c.score > 0) parts.push('score ' + (+c.score).toFixed(3));
  if (c.ppr !== undefined && c.ppr > 0) parts.push('ppr ' + (+c.ppr).toFixed(4));
  if (c.act !== undefined && c.act > 0) parts.push('act ' + (+c.act).toFixed(3));
  return parts.join(' · ') || t('deep');
}

function cardHTML(c, i) {
  const isDeep = c.hops >= 3 || (c.score !== undefined && c.score <= 0);
  const hopCls = c.hops === 1 ? 'hop-1' : c.hops === 2 ? 'hop-2' : c.hops >= 3 ? 'hop-3' : '';
  const hopLabel = c.hops ? c.hops + '-hop' : '';
  const hopEl = hopLabel
    ? `<span class="hop ${hopCls}${isDeep && c.hops >= 3 ? ' deep' : ''}">${hopLabel}${isDeep && c.score <= 0 ? ' ' + t('deep') : ''}</span>`
    : '';
  const openLink = c.uri ? `<a class="open" data-uri="${esc(c.uri)}" data-id="${esc(c.id)}" href="${esc(c.uri)}" onclick="event.stopPropagation()" title="${t('open')}">${t('open')}</a>` : '';
  // v0.1.12：.id 收敛为 title 悬停提示（不常显）；path 药丸链化、中间节点可点击续漫游。
  // path 在 REST 里是数组（roamItem.Path []string），也可能为旧字符串，兼容两者。
  const pathArr = Array.isArray(c.path) ? c.path
    : (typeof c.path === 'string' && c.path ? c.path.split('→') : []);
  const pathPills = pathArr.length > 1
    ? `<div class="path">${pathArr.map(pid => {
        const id = String(pid).trim();
        return `<span class="rel-node path-node" data-id="${esc(id)}" data-title="${esc(id)}">${esc(id)}</span>`;
      }).join('<span class="rel-arrow">→</span>')}</div>`
    : (pathArr.length ? `<div class="path">${esc(pathArr.join('→'))}</div>` : '');
  return `<div class="card" data-id="${esc(c.id)}" data-title="${esc(c.title)}" tabindex="0">
    <div class="top" title="${esc(c.id)}">
      <span class="rank">${i + 1}</span>
      <span class="title">${esc(c.title)}</span>
      <span class="id">${esc(c.id)}</span>
      <span class="type">${esc(c.type)}</span>
      ${hopEl}
      ${openLink}
    </div>
    ${pathPills}
    <div class="scores">${esc(scoreLine(c))}</div>
    <div class="actions">
      <button class="act" data-preview="${esc(c.id)}" onclick="event.stopPropagation(); showPreview(this.dataset.preview)">${t('preview')}</button>
      <button class="act" data-similar="${esc(c.id)}" onclick="event.stopPropagation(); showSimilar(this.dataset.similar)">${t('similar')}</button>
      <button class="act" data-relfrom="${esc(c.id)}" onclick="event.stopPropagation(); relWith(this.dataset.relfrom)">${t('relTo')}</button>
    </div>
  </div>`;
}

function esc(s) {
  return String(s == null ? '' : s).replace(/[&<>"']/g, c =>
    ({ '&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;' }[c]));
}

// 取节点别名（v0.1.15）：/api/node 返回 aliases，若有非空别名返回第一个，

// ---- 关系查询（/api/relation）----
async function queryRelation() {
  const from = $('#rel-from').value.trim();
  const to = $('#rel-to').value.trim();
  const box = $('#rel-result');
  if (!from || !to) { box.innerHTML = '<div class="rel-empty">' + t('relEmpty') + '</div>'; return; }
  box.innerHTML = '<div class="loading">' + t('loading') + '</div>';
  try {
    const r = await fetch('/api/relation?from=' + encodeURIComponent(from) + '&to=' + encodeURIComponent(to));
    const d = await r.json();
    if (d.error) { box.innerHTML = '<div class="rel-empty">' + esc(d.error) + '</div>'; return; }
    let pathHtml = '';
    const path = d.path || [], pathNodes = d.path_nodes || [];
    if (Array.isArray(path) && path.length) {
      const frags = path.map(id => {
        const pn = pathNodes.find(n => n.id === id);
        const title = pn ? pn.title : id;
        return `<span class="rel-node" data-id="${esc(id)}" data-title="${esc(title)}">${esc(title)}</span>`;
      });
      pathHtml = '<div class="rel-path">' + frags.join('<span class="rel-arrow">→</span>') + '</div>';
    } else { pathHtml = '<div class="rel-empty">' + t('relNoPath') + '</div>'; }
    const stats = [];
    if (d.affinity !== undefined) stats.push('affinity ' + (+d.affinity).toFixed(4));
    if (d.activation !== undefined) stats.push(t('relStats') + ' ' + (+d.activation).toFixed(3) + (d.hops >= 0 ? ' (' + d.hops + '-hop)' : ''));
    if (d.ppr_from_to !== undefined) stats.push('ppr→ ' + (+d.ppr_from_to).toFixed(4));
    if (d.ppr_to_from !== undefined) stats.push('ppr← ' + (+d.ppr_to_from).toFixed(4));
    const evi = (d.evidence || []).map(ev => (ev.witnesses || []).join('、')).filter(Boolean);
    box.innerHTML = pathHtml +
      (stats.length ? '<div class="rel-stats">' + stats.join(' · ') + '</div>' : '') +
      (evi.length ? '<div class="rel-stats">' + t('relEvidence') + ': ' + esc(evi.join('；')) + '</div>' : '');
  } catch (e) { box.innerHTML = '<div class="rel-empty">' + t('relFail') + ': ' + esc(e.message) + '</div>'; }
}

// 邻居/被引用统一渲染（v0.1.15）：按类型分组 + type- 着色、去重、限流 + 折叠、
// 超长标题截断——此前 89 个胶囊无差别平铺 + "人物_XXX"占位标题，视觉噪声大。
function detailGroup(label, refs) {
  const list = (refs || []);
  const sec = document.createElement('div');
  // 去重（同 id）
  const seen = new Set(), uniq = [];
  for (const r of list) {
    if (!seen.has(r.id)) { seen.add(r.id); uniq.push(r); }
  }
  // 按类型分组，组内按标题稳定排序
  const groups = {};
  for (const r of uniq) (groups[r.type || 'note'] = groups[r.type || 'note'] || []).push(r);
  const order = Object.keys(groups).sort();
  const MAX = 18; // 每组最多显示（超出折叠）
  let html = `<div class="dsec">${label}（${uniq.length}）</div>`;
  for (const tp of order) {
    const items = groups[tp];
    const typeCls = 'type-' + esc(tp);
    const shown = items.slice(0, MAX);
    const extra = items.length - shown.length;
    const chips = shown.map(r => {
      const tt = (r.title || r.id).length > 24 ? (r.title || r.id).slice(0, 24) + '…' : (r.title || r.id);
      return `<span class="dnod ${typeCls}" data-id="${esc(r.id)}" data-title="${esc(r.title || r.id)}">${esc(tt)}</span>`;
    }).join('');
    html += `<div class="dgroup"><span class="dg-tag ${typeCls}">${esc(tp)}</span>${chips}` +
      (extra > 0 ? `<span class="dmore" title="${esc(label)}">+${extra} 更多</span>` : '') + `</div>`;
  }
  sec.innerHTML = html || `<div class="dempty">${t('noNeighbors')}</div>`;
  return sec.outerHTML;
}

// ---- 结构相似（/api/similar）→ 抽屉 ----
async function showSimilar(id) {
  openDrawer(t('simTitle'), `<div class="cfg-head"><span>${t('simTitle')} <small style="color:var(--muted);font-weight:400">${t('simSub')}</small></span></div><div id="sim-result" class="rel-result"></div>`);
  const box = $('#sim-result');
  if (!box) return;
  box.innerHTML = '<div class="loading">' + t('simLoading') + '</div>';
  try {
    const r = await fetch('/api/similar?id=' + encodeURIComponent(id) + '&k=12');
    const d = await r.json();
    if (d.error) { box.innerHTML = '<div class="rel-empty">' + esc(d.error) + '</div>'; return; }
    const list = d.results || [];
    if (!list.length) { box.innerHTML = '<div class="rel-empty">' + t('simEmpty') + '</div>'; return; }
    box.innerHTML = list.map(s => {
      const title = s.title || s.id;
      const evi = (s.shared_titles || []).slice(0, 4).join('、');
      return `<div class="sim-item" data-id="${esc(s.id)}" data-title="${esc(title)}">
        <span>${esc(title)} <small style="color:var(--muted)">[${esc(s.type)}]</small></span>
        <span class="evi">${esc(evi ? t('simDirect') + ': ' + evi : '')}</span>
      </div>`;
    }).join('');
  } catch (e) { box.innerHTML = '<div class="rel-empty">' + t('simFail') + ': ' + esc(e.message) + '</div>'; }
}

// ---- 反馈统计（/api/touch/stats）→ 抽屉 ----
async function showStats() {
  openDrawer(t('statTitle'), `<div class="cfg-head"><span>${t('statTitle')} <small style="color:var(--muted);font-weight:400">${t('statSub')}</small></span></div><div id="stat-result"></div>`);
  const box = $('#stat-result');
  if (!box) return;
  box.innerHTML = '<div class="loading">' + t('statLoading') + '</div>';
  try {
    const r = await fetch('/api/touch/stats?n=10');
    const d = await r.json();
    if (d.error) { box.innerHTML = '<div class="rel-empty">' + esc(d.error) + '</div>'; return; }
    const tag = x => `<span class="stat-tag">${esc(x.id)} <b>${x.count}</b></span>`;
    const targets = (d.targets || []).map(tag).join('') || `<span style="color:var(--muted)">${t('statNoData')}</span>`;
    const sources = (d.sources || []).map(tag).join('') || `<span style="color:var(--muted)">${t('statNoData')}</span>`;
    box.innerHTML =
      `<div class="stat-line">${t('statTotal')}：<b>${d.total || 0}</b></div>` +
      `<div class="stat-line">${t('statTargets')}：</div><div>${targets}</div>` +
      `<div class="stat-line">${t('statSources')}：</div><div>${sources}</div>` +
      `<div style="color:var(--muted);font-size:11.5px;margin-top:8px">${t('statFoot')}</div>`;
  } catch (e) { box.innerHTML = '<div class="rel-empty">' + t('statFail') + ': ' + esc(e.message) + '</div>'; }
}

// ---- 参数抽屉 ----
function renderCfg() {
  const box = $('#drawer-body');
  // 参数内容只在 cfg 抽屉打开时渲染；这里操作 #cfg-fields（如存在）
  const grid = $('#cfg-fields');
  if (!grid) return;
  const groups = {};
  for (const d of paramDefs) (groups[d.group || '其他'] = groups[d.group || '其他'] || []).push(d);
  let html = '';
  for (const g of Object.keys(groups)) {
    html += '<div class="cfg-group-label">' + esc(g) + '</div><div class="cfg-grid">';
    for (const d of groups[g]) {
      const v = params[d.key];
      const val = d.type === 'int' ? Math.round(v) : (+v).toFixed(d.step < 0.05 ? 2 : 1);
      html += '<div class="cfg-field"><div class="row"><span class="lbl">' + esc(d.label) + '</span>' +
        '<span class="val" id="cfg-val-' + esc(d.key) + '">' + val + '</span></div>' +
        '<input type="range" min="' + d.min + '" max="' + d.max + '" step="' + d.step +
        '" value="' + v + '" data-key="' + esc(d.key) + '">' +
        '<span class="hint">' + esc(d.hint || '') + '</span></div>';
    }
    html += '</div>';
  }
  grid.innerHTML = html;
  $$('#cfg-fields input[type=range]').forEach(inp => {
    inp.addEventListener('input', () => {
      const d = defFor(inp.dataset.key);
      const v = d.type === 'int' ? Math.round(+inp.value) : +inp.value;
      params[inp.dataset.key] = v;
      const el = $('#cfg-val-' + inp.dataset.key);
      if (el) el.textContent = d.type === 'int' ? v : (+v).toFixed(d.step < 0.05 ? 2 : 1);
      saveParams();
      reRoamDebounced();
    });
  });
}
function defFor(key) { return paramDefs.find(d => d.key === key); }
function openSettings() {
  const groups = {};
  for (const d of paramDefs) (groups[d.group || '其他'] = groups[d.group || '其他'] || []).push(d);
  const grid = '<div id="cfg-fields"></div>';
  openDrawer(t('cfgTitle2'), `<div class="cfg-head"><span>${t('cfgTitle2')}</span><button id="cfg-reset" class="btn ghost sm">${t('cfgReset')}</button></div>${grid}`);
  renderCfg();
  $('#cfg-reset').onclick = resetParams;
}
function resetParams() {
  for (const d of paramDefs) params[d.key] = +d.default;
  saveParams(); renderCfg(); reRoam();
}

let reRoamTimer = null;
function reRoamDebounced() { clearTimeout(reRoamTimer); reRoamTimer = setTimeout(reRoam, 350); }
function reRoam() { const q = $('#q').value.trim(); if (q) roam(q, 'replace'); else renderHome(); }

// ---- 导出当前漫游为 Markdown（/api/roam?export=1）----
// v0.1.15 修复：改用 fetch 取 blob（fetch 包装自动带 X-Seren-Token 头）——
// 此前用 <a href> 直接导航下载，a 标签不走 fetch 包装、不带 token，
// 被 auth 中间件拒绝（403/404 类错误页，v0.1.8 token 鉴权引入后一直存在）。
function exportMarkdown() {
  const q = $('#q').value.trim();
  let url = '/api/roam?export=1' + (q ? '&q=' + encodeURIComponent(q) : '');
  const qs = paramQS();
  if (qs) url += '&' + qs;
  fetch(url).then(r => {
    if (!r.ok) throw new Error(t('reqFail') + ' HTTP ' + r.status);
    return r.blob();
  }).then(blob => {
    const a = document.createElement('a');
    a.href = URL.createObjectURL(blob);
    a.download = t('exportName');
    document.body.appendChild(a);
    a.click(); a.remove();
    setTimeout(() => URL.revokeObjectURL(a.href), 2000);
  }).catch(e => { $('#meta').textContent = e.message; });
}

// ---- 回到初始页 / 浏览器历史 ----
function goHome() { stack = ['']; pos = 0; roam('', 'replace'); }
window.addEventListener('popstate', e => {
  const q = (e.state && e.state.q) || '';
  if (pos > 0 && stack[pos - 1] === q) { pos--; }
  else if (pos < stack.length - 1 && stack[pos + 1] === q) { pos++; }
  else { stack = [q]; pos = 0; }
  roam(q, 'replace');
});

// ---- 事件委托：卡片 / 气泡 / 锚点 / 关系节点 / 相似项 统一点击 ----
document.addEventListener('click', e => {
  if (e.target.closest('a.open')) return; // 「打开 ↗」走 openNode（桥或外链）
  const rel = e.target.closest('.rel-node');
  if (rel && rel.dataset.id) {
    $('#rel-from') && ($('#rel-from').value = rel.dataset.title || rel.dataset.id);
    $('#q').value = rel.dataset.title || rel.dataset.id;
    roam(rel.dataset.id, 'push', rel.dataset.title || rel.dataset.id);
    return;
  }
  const si = e.target.closest('.sim-item');
  if (si && si.dataset.id) { roam(si.dataset.id, 'push', si.dataset.title || si.dataset.id); return; }
  const el = e.target.closest('.card, .bubble, #anchors .anchor[data-id]');
  if (el && el.dataset.id) {
    $('#meta').textContent = t('roaming', { x: el.dataset.title || el.title });
    fetch('/api/touch', {
      method: 'POST', headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ target: el.dataset.id, from: $('#q').value || '' })
    }).catch(() => {});
    roam(el.dataset.id, 'push', el.dataset.title || el.title);
  }
});

// 「打开 ↗」：嵌入时 postMessage 桥，否则外链
document.addEventListener('click', e => {
  const o = e.target.closest('a.open');
  if (!o) return;
  e.preventDefault();
  openNode(o.dataset.uri, o.dataset.id);
});

// ---- 自动监听提示 + is_pending 提示条（轮询 /api/stats，roadmap #14）----
let lastRevision = null;
async function pollStats() {
  try {
    const s = await (await fetch('/api/stats')).json();
    if (s.is_pending) {
      const b = $('#pending-banner');
      if (b) { b.classList.remove('hidden'); $('#pending-text').textContent = t('pendingText'); }
    } else {
      const b = $('#pending-banner');
      if (b) b.classList.add('hidden');
    }
    if (lastRevision === null) { lastRevision = s.revision || 0; return; }
    if ((s.revision || 0) !== lastRevision) {
      lastRevision = s.revision || 0;
      const m = $('#meta');
      if (m) m.textContent = t('updated', { n: s.nodes });
    }
  } catch (e) { /* 轮询失败静默 */ }
}
setInterval(pollStats, 30000);
$('#pending-refresh').onclick = () => $('#refresh').click();

// ---- 页面 JS 错误可见 ----
window.addEventListener('error', e => { const m = $('#meta'); if (m) m.textContent = t('pageErr') + ': ' + (e.message || 'unknown'); });

// ---- 交互绑定 ----
$('#back').onclick = () => { if (pos > 0) history.back(); };
$('#home').onclick = goHome;
$('#brand').onclick = goHome;
$('#go').onclick = () => { const q = $('#q').value.trim(); if (q) roam(q, 'push'); };
$('#dice').onclick = roamRandom;
$('#q').addEventListener('keydown', e => { if (e.key === 'Enter') $('#go').click(); });
$('#rel-toggle').onclick = () => openDrawer(t('relTitle'), `
  <div class="rel-inputs"><input id="rel-from" placeholder="${t('relFromPh')}"><span class="rel-x">↔</span>
    <input id="rel-to" placeholder="${t('relToPh')}"><button id="rel-go" class="btn primary">${t('relGo')}</button></div>
  <div id="rel-result" class="rel-result"></div>`);
$('#cfg-toggle').onclick = openSettings;
$('#stat-toggle').onclick = showStats;
$('#export').onclick = exportMarkdown;

// 关系抽屉内绑定（每次打开重建，需重新绑定）
document.addEventListener('click', e => {
  if (e.target.id === 'rel-go') {
    const ef = $('#rel-from'), et = $('#rel-to');
    const f = ef.value.trim(), to = et.value.trim();
    if (f && to) queryRelation(); else $('#rel-result').innerHTML = '<div class="rel-empty">' + t('relEmpty') + '</div>';
    return;
  }
  // 当前节点操作栏（v0.1.15）：详情/相似/关系一键（按钮为 .btn ghost sm，不限 class）
  const cur = e.target.closest('[data-cur][data-cur-act]');
  if (cur) {
    const id = cur.dataset.cur, act = cur.dataset.curAct;
    if (act === 'preview') showPreview(id);
    else if (act === 'similar') showSimilar(id);
    else if (act === 'relation') relWith(id);
    return;
  }
});
document.addEventListener('keydown', e => {
  if (e.key === 'Enter' && (e.target.id === 'rel-from' || e.target.id === 'rel-to')) queryRelation();
});

// ---- 对账刷新（POST /api/refresh）----
$('#refresh').onclick = async () => {
  const btn = $('#refresh');
  btn.disabled = true;
  const hint = $('#meta');
  hint.textContent = t('refreshing');
  try {
    const r = await fetch('/api/refresh', { method: 'POST' });
    const d = await r.json();
    if (d.error) { hint.textContent = t('refreshFail') + ': ' + d.error; return; }
    hint.textContent = t('refreshDone', {
      a: d.added, u: d.updated, d: d.deleted, r: (d.renamed || 0), c: d.unchanged,
      ms: d.duration_ms, n: d.nodes
    });
    fetch('/api/config').then(r => r.json()).then(c => {
      const line = $('#source');
      if (c.source) { line.dataset.source = c.source; line.dataset.nodes = c.nodes; line.dataset.edges = c.edges; updateSourceLine(); }
    }).catch(() => {});
    const q = $('#q').value.trim();
    if (q) roam(q, 'replace'); else renderHome();
  } catch (e) { hint.textContent = t('refreshFail') + ': ' + e.message; }
  finally { btn.disabled = false; }
};

// ---- 键盘导航简版（v0.1.12）：/ 聚焦搜索，Esc 关抽屉/浮层 ----
document.addEventListener('keydown', e => {
  if (e.key === '/' && document.activeElement !== $('#q')) { e.preventDefault(); $('#q').focus(); }
  else if (e.key === 'Escape') { closeDrawer(); }
});

// 初始：把当前状态入栈
const initQ = new URLSearchParams(location.search).get('q') || '';
stack = [initQ]; pos = 0;
roam(initQ, 'replace');
</script>
</body>
